<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendario Empresarial, Subasta de Trabajos & WhatsApp</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM 18 UMD CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #030712;
      color: #f9fafb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #111827;
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4b5563;
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 selection:bg-emerald-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- INITIAL SEED DATA WITH MULTIPLE CONTRACTORS & AUCTION TASKS ---
    const DEFAULT_USERS = [
      { id: 'usr-1', name: 'Ing. Carlos Mendoza (Jefe)', email: 'jefe@empresa.com', phone: '+525551234567', role: 'BOSS', status: 'ACTIVE' }
    ];

    const DEFAULT_PROJECTS = [
      { id: 'prj-1', name: 'Proyecto Alfa - Remodelación Sede Central', color: 'emerald' },
      { id: 'prj-2', name: 'Proyecto Beta - Infraestructura & Servidores', color: 'cyan' },
      { id: 'prj-3', name: 'Proyecto Gamma - Climatización Corporativa', color: 'amber' },
      { id: 'prj-4', name: 'Proyecto Delta - Redes & Cableado Estructurado', color: 'teal' }
    ];

    const getInitialTasks = () => {
      const today = new Date();
      const dateStr = today.toISOString().split('T')[0];

      return [
        {
          id: 'task-1',
          title: 'Mantenimiento Preventivo de Servidores',
          description: 'Revisión preventiva de gabinete de comunicaciones y respaldos.',
          location: 'Oficina Central - Piso 2',
          startTime: `${dateStr}T09:00:00`,
          endTime: `${dateStr}T11:30:00`,
          status: 'PENDING',
          isPersonal: false,
          isAuction: false,
          assignedToId: 'usr-2',
          createdById: 'usr-1',
          projectId: 'prj-2'
        },
        {
          id: 'task-2',
          title: '⚡ SUBASTA: Mantenimiento Urgente Aire Acondicionado',
          description: 'Trabajo disponible para el primer contratista/partner que lo reclame.',
          location: 'Edificio Corporativo - Sala de Juntas',
          startTime: `${dateStr}T14:00:00`,
          endTime: `${dateStr}T16:30:00`,
          status: 'OPEN_AUCTION',
          isPersonal: false,
          isAuction: true,
          assignedToId: null, // SIN ASIGNAR - SUBASTA ABIERTA
          createdById: 'usr-1',
          projectId: 'prj-3'
        },
        {
          id: 'task-3',
          title: 'Instalación Cableado Cat6a',
          description: 'Subcontrato de certificación y tirado de 24 puntos de red.',
          location: 'Edificio B - Planta Baja',
          startTime: `${dateStr}T13:00:00`,
          endTime: `${dateStr}T16:00:00`,
          status: 'IN_PROGRESS',
          isPersonal: false,
          isAuction: false,
          assignedToId: 'usr-3',
          createdById: 'usr-1',
          projectId: 'prj-4'
        },
        {
          id: 'task-4',
          title: '🟣 Cita Médica & Exámenes Ocupacionales',
          description: 'Asunto y compromiso personal.',
          location: 'Clínica San José',
          startTime: `${dateStr}T17:00:00`,
          endTime: `${dateStr}T18:30:00`,
          status: 'PENDING',
          isPersonal: true,
          isAuction: false,
          assignedToId: 'usr-2',
          createdById: 'usr-2',
          projectId: null
        }
      ];
    };

    const getInitialWhatsAppLogs = () => {
      const today = new Date();
      const dateStr = today.toISOString().split('T')[0];
      return [
        {
          id: 'log-1',
          recipientName: 'Roberto Gómez (Contratista 3ero)',
          recipientPhone: '+525554443322',
          message: `NUEVA ASIGNACIÓN DE TRABAJO\nHola Roberto Gómez, el Ing. Carlos Mendoza te ha asignado el trabajo 'Instalación Cableado Cat6a' el ${dateStr} de 13:00 a 16:00. Horario reservado.`,
          status: 'DIRECT_WHATSAPP',
          sentAt: new Date().toISOString()
        }
      ];
    };

    // --- LOGIN SCREEN COMPONENT ---
    function LoginScreen({ users, onLogin, onRegister }) {
      const [activeTab, setActiveTab] = useState('CREDENTIALS'); // 'CREDENTIALS' | 'REGISTER'
      const [userOrEmailInput, setUserOrEmailInput] = useState('jefe@empresa.com');
      const [password, setPassword] = useState('123456');
      const [rememberMe, setRememberMe] = useState(true);
      const [errorMsg, setErrorMsg] = useState('');

      // Registration State
      const [regName, setRegName] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regPhone, setRegPhone] = useState('');
      const [regPassword, setRegPassword] = useState('');
      const [regConfirmPassword, setRegConfirmPassword] = useState('');
      const [regSuccess, setRegSuccess] = useState(false);
      const [regError, setRegError] = useState('');

      const handleCredSubmit = (e) => {
        e.preventDefault();
        setErrorMsg('');
        const query = userOrEmailInput.trim().toLowerCase();
        if (!query) {
          setErrorMsg('Por favor ingresa tu nombre de usuario o correo electrónico.');
          return;
        }

        const target = users.find(u => 
          u.email.toLowerCase() === query || 
          u.name.toLowerCase() === query ||
          u.id.toLowerCase() === query ||
          u.email.toLowerCase().includes(query) ||
          u.name.toLowerCase().includes(query)
        );

        if (!target) {
          setErrorMsg(`❌ No se encontró ningún usuario o correo registrado que coincida con '${userOrEmailInput}'. Verifica tus datos de acceso.`);
          return;
        }

        if (target.status === 'PENDING_APPROVAL' || target.role === 'PENDING') {
          setErrorMsg('⏳ Tu cuenta fue registrada pero está PENDIENTE DE APROBACIÓN y asignación de rol por el Jefe. Contacta a la administración para activar tu usuario.');
          return;
        }

        onLogin(target, rememberMe);
      };

      const handleRegisterSubmit = (e) => {
        e.preventDefault();
        setRegError('');
        if (!regName.trim() || !regEmail.trim() || !regPassword) {
          setRegError('Por favor completa todos los campos obligatorios.');
          return;
        }
        if (regPassword !== regConfirmPassword) {
          setRegError('Las contraseñas no coinciden.');
          return;
        }
        const exists = users.some(u => u.email.toLowerCase() === regEmail.trim().toLowerCase());
        if (exists) {
          setRegError('Ya existe un usuario registrado con este correo electrónico.');
          return;
        }

        const newUser = {
          id: 'usr-' + Date.now(),
          name: regName.trim(),
          email: regEmail.trim(),
          phone: regPhone.trim() || '+525550000000',
          role: 'PENDING',
          status: 'PENDING_APPROVAL',
          createdAt: new Date().toISOString()
        };

        onRegister(newUser);
        setRegSuccess(true);
      };

      return (
        <div className="min-h-screen bg-gray-950 text-gray-100 flex items-center justify-center p-4 sm:p-6 relative overflow-hidden selection:bg-emerald-600 selection:text-white">
          {/* Background Decorative Glow Effect (Esmeralda & Amber) */}
          <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-emerald-600/15 blur-[120px] rounded-full pointer-events-none"></div>
          <div className="absolute bottom-10 right-10 w-[350px] h-[350px] bg-amber-600/10 blur-[100px] rounded-full pointer-events-none"></div>
          <div className="absolute top-10 left-10 w-[300px] h-[300px] bg-teal-600/10 blur-[90px] rounded-full pointer-events-none"></div>

          <div className="w-full max-w-xl bg-gray-900/90 border border-emerald-950 rounded-3xl shadow-2xl backdrop-blur-xl p-6 sm:p-8 relative z-10">
            {/* Brand Header */}
            <div className="text-center mb-8">
              <div className="inline-flex items-center justify-center p-3 bg-gradient-to-br from-emerald-500 to-teal-700 rounded-2xl text-white shadow-xl shadow-emerald-600/30 mb-4">
                <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
              </div>
              <h1 className="text-2xl sm:text-3xl font-black text-white tracking-tight">Calendario Empresarial</h1>
              <p className="text-xs sm:text-sm text-emerald-400/80 font-medium mt-1">Sistema de Asignaciones, Subastas de Trabajos & Control de Agenda</p>
            </div>

            {/* Tab Selection Buttons */}
            <div className="grid grid-cols-2 p-1 bg-gray-950/80 border border-gray-800/80 rounded-2xl mb-6 text-[11px] sm:text-xs font-bold">
              <button
                type="button"
                onClick={() => { setActiveTab('CREDENTIALS'); setRegSuccess(false); }}
                className={`py-2.5 rounded-xl transition-all cursor-pointer flex items-center justify-center space-x-1 ${
                  activeTab === 'CREDENTIALS'
                    ? 'bg-emerald-600 text-white shadow-md'
                    : 'text-gray-400 hover:text-white'
                }`}
              >
                <span>🔒 Ingreso</span>
              </button>
              <button
                type="button"
                onClick={() => { setActiveTab('REGISTER'); setRegSuccess(false); }}
                className={`py-2.5 rounded-xl transition-all cursor-pointer flex items-center justify-center space-x-1 ${
                  activeTab === 'REGISTER'
                    ? 'bg-emerald-600 text-white shadow-md'
                    : 'text-gray-400 hover:text-white'
                }`}
              >
                <span>✨ Crear Cuenta</span>
              </button>
            </div>

            {/* TAB 1: CREDENCIALES */}
            {activeTab === 'CREDENTIALS' && (
              <form onSubmit={handleCredSubmit} className="space-y-4">
                {errorMsg && (
                  <div className="p-3 bg-red-950/80 border border-red-800 text-red-300 rounded-xl text-xs font-semibold leading-relaxed">
                    {errorMsg}
                  </div>
                )}

                <div>
                  <label className="block text-xs font-bold text-gray-300 mb-1.5 uppercase tracking-wider">Usuario o Correo Electrónico</label>
                  <input
                    type="text"
                    required
                    value={userOrEmailInput}
                    onChange={e => setUserOrEmailInput(e.target.value)}
                    placeholder="Ej. jefe@empresa.com o Carlos Mendoza"
                    className="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500 font-semibold placeholder:text-gray-600"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-gray-300 mb-1.5 uppercase tracking-wider">Contraseña de Acceso</label>
                  <input
                    type="password"
                    value={password}
                    onChange={e => setPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                  />
                  <p className="text-[10px] text-gray-500 mt-1">Para entorno demo, cualquier contraseña estándar o la clave predeterminada es válida.</p>
                </div>

                <div className="flex items-center justify-between text-xs pt-1">
                  <label className="flex items-center space-x-2 text-gray-400 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={rememberMe}
                      onChange={e => setRememberMe(e.target.checked)}
                      className="rounded border-gray-800 text-emerald-600 focus:ring-emerald-500 bg-gray-950"
                    />
                    <span>Recordar mi sesión en este navegador</span>
                  </label>
                </div>

                <button
                  type="submit"
                  className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-600/30 transition-all cursor-pointer flex items-center justify-center space-x-2 mt-2"
                >
                  <span>Iniciar Sesión Segura</span>
                  <span>➔</span>
                </button>
              </form>
            )}

            {/* TAB 3: REGISTRO / CREAR CUENTA */}
            {activeTab === 'REGISTER' && (
              <form onSubmit={handleRegisterSubmit} className="space-y-4">
                {regSuccess ? (
                  <div className="p-4 bg-emerald-950/80 border border-emerald-700/80 rounded-2xl text-emerald-200 text-xs leading-relaxed text-center space-y-3">
                    <div className="text-2xl">🎉</div>
                    <p className="font-bold text-sm text-emerald-300">¡Cuenta registrada con éxito!</p>
                    <p>Tu solicitud ha sido enviada al <strong>Jefe / Administrador</strong> para la asignación de tu rol de acceso.</p>
                    <p className="text-[11px] text-emerald-400">Una vez aprobado, podrás ingresar con tu usuario o correo electrónico.</p>
                    <button
                      type="button"
                      onClick={() => { setActiveTab('CREDENTIALS'); setRegSuccess(false); }}
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs transition-all cursor-pointer mt-2"
                    >
                      Ir al Formulario de Ingreso
                    </button>
                  </div>
                ) : (
                  <>
                    {regError && (
                      <div className="p-3 bg-red-950/80 border border-red-800 text-red-300 rounded-xl text-xs font-semibold leading-relaxed">
                        {regError}
                      </div>
                    )}

                    <div>
                      <label className="block text-xs font-bold text-gray-300 mb-1.5 uppercase tracking-wider">Nombre Completo *</label>
                      <input
                        type="text"
                        required
                        value={regName}
                        onChange={e => setRegName(e.target.value)}
                        placeholder="Ej. Ing. Roberto Gómez"
                        className="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500 font-semibold placeholder:text-gray-600"
                      />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-bold text-gray-300 mb-1.5 uppercase tracking-wider">Correo Electrónico *</label>
                        <input
                          type="email"
                          required
                          value={regEmail}
                          onChange={e => setRegEmail(e.target.value)}
                          placeholder="usuario@empresa.com"
                          className="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500 placeholder:text-gray-600"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-300 mb-1.5 uppercase tracking-wider">Teléfono / WhatsApp</label>
                        <input
                          type="tel"
                          value={regPhone}
                          onChange={e => setRegPhone(e.target.value)}
                          placeholder="+525551234567"
                          className="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500 placeholder:text-gray-600"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-bold text-gray-300 mb-1.5 uppercase tracking-wider">Contraseña *</label>
                        <input
                          type="password"
                          required
                          value={regPassword}
                          onChange={e => setRegPassword(e.target.value)}
                          placeholder="••••••••"
                          className="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-300 mb-1.5 uppercase tracking-wider">Confirmar Contraseña *</label>
                        <input
                          type="password"
                          required
                          value={regConfirmPassword}
                          onChange={e => setRegConfirmPassword(e.target.value)}
                          placeholder="••••••••"
                          className="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                        />
                      </div>
                    </div>

                    <p className="text-[10px] text-amber-400/90 font-medium bg-amber-950/40 p-2.5 rounded-xl border border-amber-800/40">
                      ℹ️ Nota: Al registrarte, tu cuenta quedará en estado <strong>Pendiente de Aprobación</strong>. El Jefe o Administrador asignará tu rol antes de dar acceso.
                    </p>

                    <button
                      type="submit"
                      className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-600/30 transition-all cursor-pointer flex items-center justify-center space-x-2 mt-2"
                    >
                      <span>Enviar Solicitud de Registro</span>
                      <span>✨</span>
                    </button>
                  </>
                )}
              </form>
            )}

            {/* Footer info */}
            <div className="mt-8 pt-4 border-t border-gray-800/80 text-center">
              <p className="text-[11px] text-gray-500 flex items-center justify-center space-x-1">
                <span>🛡️ Conexión Local Protegida • Control de Permisos en Tiempo Real</span>
              </p>
            </div>
          </div>
        </div>
      );
    }

    // --- USER PROFILE MODAL (EDIT OWN PROFILE & REQUEST ROLE CHANGE) ---
    function UserProfileModal({ isOpen, onClose, currentUser, setCurrentUser, setUsers }) {
      if (!isOpen || !currentUser) return null;

      const [name, setName] = useState(currentUser.name || '');
      const [email, setEmail] = useState(currentUser.email || '');
      const [phone, setPhone] = useState(currentUser.phone || '');
      const [requestedRole, setRequestedRole] = useState(currentUser.role || 'EMPLOYEE');
      const [savedSuccess, setSavedSuccess] = useState('');

      const isBoss = currentUser.role === 'BOSS';

      useEffect(() => {
        if (currentUser) {
          setName(currentUser.name || '');
          setEmail(currentUser.email || '');
          setPhone(currentUser.phone || '');
          setRequestedRole(currentUser.pendingRoleChange || currentUser.role || 'EMPLOYEE');
          setSavedSuccess('');
        }
      }, [currentUser, isOpen]);

      const handleSave = (e) => {
        e.preventDefault();
        if (!name.trim() || !email.trim()) return;

        let roleChangeRequested = false;
        let updatedUser = {
          ...currentUser,
          name: name.trim(),
          email: email.trim(),
          phone: phone.trim() || '+525550000000'
        };

        // If current user is BOSS, role change is immediate
        if (isBoss) {
          updatedUser.role = requestedRole;
          delete updatedUser.pendingRoleChange;
        } else if (requestedRole !== currentUser.role) {
          // If non-Boss selects a different role, create a pending request for Boss approval
          updatedUser.pendingRoleChange = requestedRole;
          roleChangeRequested = true;
        }

        setUsers(prev => prev.map(u => u.id === currentUser.id ? updatedUser : u));
        setCurrentUser(updatedUser);

        if (roleChangeRequested) {
          setSavedSuccess('📩 ¡Perfil guardado! Tu solicitud de cambio de rol ha sido enviada al Jefe para su aprobación.');
        } else {
          setSavedSuccess('✓ ¡Perfil actualizado correctamente!');
        }

        setTimeout(() => {
          setSavedSuccess('');
          onClose();
        }, 1800);
      };

      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-gray-900 border border-gray-800 rounded-3xl max-w-md w-full shadow-2xl overflow-hidden">
            <div className="p-5 border-b border-gray-800 flex items-center justify-between bg-gray-950/60">
              <div className="flex items-center space-x-3">
                <div className="p-2.5 bg-emerald-950 border border-emerald-700 text-emerald-300 rounded-2xl text-xl font-bold">
                  ✏️
                </div>
                <div>
                  <h3 className="text-base font-extrabold text-white">Editar Mi Perfil</h3>
                  <p className="text-xs text-gray-400">Actualiza tus datos y solicita cambio de rol</p>
                </div>
              </div>
              <button
                onClick={onClose}
                className="w-8 h-8 rounded-full bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-white flex items-center justify-center text-sm font-bold transition-colors cursor-pointer"
              >
                ✕
              </button>
            </div>

            <form onSubmit={handleSave} className="p-6 space-y-4">
              {savedSuccess && (
                <div className="p-3 bg-emerald-950/90 border border-emerald-700 text-emerald-200 rounded-xl text-xs font-bold text-center leading-relaxed">
                  {savedSuccess}
                </div>
              )}

              <div>
                <label className="block text-xs font-bold text-gray-300 mb-1.5 uppercase tracking-wider">Nombre Completo *</label>
                <input
                  type="text"
                  required
                  value={name}
                  onChange={e => setName(e.target.value)}
                  className="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500 font-semibold"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-300 mb-1.5 uppercase tracking-wider">Correo Electrónico *</label>
                <input
                  type="email"
                  required
                  value={email}
                  onChange={e => setEmail(e.target.value)}
                  className="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-300 mb-1.5 uppercase tracking-wider">Teléfono / WhatsApp</label>
                <input
                  type="tel"
                  value={phone}
                  onChange={e => setPhone(e.target.value)}
                  placeholder="+525551234567"
                  className="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                />
              </div>

              <div className="pt-2 border-t border-gray-800 space-y-2">
                <label className="block text-xs font-bold text-gray-300 uppercase tracking-wider">
                  Rol en el Sistema
                </label>
                {isBoss ? (
                  <select
                    value={requestedRole}
                    onChange={e => setRequestedRole(e.target.value)}
                    className="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500 font-semibold"
                  >
                    <option value="BOSS">👑 Jefe / Admin</option>
                    <option value="EMPLOYEE">👷 Empleado Técnico</option>
                    <option value="THIRD_PARTY">🔧 Contratista 3ero</option>
                  </select>
                ) : (
                  <div className="space-y-2">
                    <div className="flex items-center justify-between p-2.5 bg-gray-950 border border-gray-800 rounded-xl text-xs">
                      <span className="text-gray-400">Rol Actual:</span>
                      <span className="font-bold text-emerald-300">

      const pendingRegistrations = users.filter(u => u.status === 'PENDING_APPROVAL' || u.role === 'PENDING');
      const pendingRoleChanges = users.filter(u => u.status !== 'PENDING_APPROVAL' && u.pendingRoleChange);
      const activeUsers = users.filter(u => u.status !== 'PENDING_APPROVAL' && u.role !== 'PENDING');

      const [editRole, setEditRole] = useState('');

      const handleApproveRegistration = (user) => {
        const roleToAssign = selectedRoles[user.id] || 'THIRD_PARTY';
        setUsers(prev => prev.map(u => {
          if (u.id === user.id) {
            return {
              ...u,
              role: roleToAssign,
              status: 'ACTIVE'
            };
          }
          return u;
        }));
      };

      const handleApproveRoleChange = (userId) => {
        setUsers(prev => prev.map(u => {
          if (u.id === userId) {
            const updated = {
              ...u,
              role: u.pendingRoleChange
            };
            delete updated.pendingRoleChange;
            if (currentUser && currentUser.id === userId && setCurrentUser) {
              setCurrentUser(updated);
            }
            return updated;
          }
          return u;
        }));
      };

      const handleRejectRoleChange = (userId) => {
        setUsers(prev => prev.map(u => {

            const updated = { ...u };
            delete updated.pendingRoleChange;
            return updated;

          return u;

    // --- MAIN APP COMPONENT ---
    function App() {
      const [appAlert, setAppAlert] = useState(null);

      // LocalStorage Sync
      const [users, setUsers] = useState(() => {
        try {
          const saved = localStorage.getItem('cal_users');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return DEFAULT_USERS;
      });

      const [tasks, setTasks] = useState(() => {
        try {
          const saved = localStorage.getItem('cal_tasks');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch (e) {}
        return getInitialTasks();
      });

      const [whatsAppLogs, setWhatsAppLogs] = useState(() => {
        try {
          const saved = localStorage.getItem('cal_wa_logs');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch (e) {}
        return getInitialWhatsAppLogs();
      });

      const [projects, setProjects] = useState(() => {
        try {
          const saved = localStorage.getItem('cal_projects');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch (e) {}
        return DEFAULT_PROJECTS;
      });

      const [isLoggedIn, setIsLoggedIn] = useState(false);

      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const savedUserId = localStorage.getItem('cal_logged_user_id');
          if (savedUserId) {
            const found = users.find(u => u.id === savedUserId);
            if (found) return found;
          }
        } catch (e) {}
        return users[0] || DEFAULT_USERS[0];
      });

      const handleLogin = (userToLogin, remember = true) => {
        setCurrentUser(userToLogin);
        setIsLoggedIn(true);
        localStorage.setItem('cal_logged_user_id', userToLogin.id);
        if (remember) {
          localStorage.setItem('cal_is_logged_in', JSON.stringify(true));
        }
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        localStorage.setItem('cal_is_logged_in', JSON.stringify(false));
      };
      const [selectedUserFilter, setSelectedUserFilter] = useState('');
      const [selectedProjectFilter, setSelectedProjectFilter] = useState('');
      const [viewMode, setViewMode] = useState('WEEK'); // 'DAY' | 'WEEK' | 'MONTH' | 'AGENDA'
      const [currentDate, setCurrentDate] = useState(new Date());
      const [now, setNow] = useState(new Date());

      const [isWhatsAppModalOpen, setIsWhatsAppModalOpen] = useState(false);
      const [whatsAppPromptQueue, setWhatsAppPromptQueue] = useState([]);
      const [isCompletedLogsModalOpen, setIsCompletedLogsModalOpen] = useState(false);
      const [isProjectsModalOpen, setIsProjectsModalOpen] = useState(false);
      const [openFolderId, setOpenFolderId] = useState(null);
      const [folderTaskTab, setFolderTaskTab] = useState('ALL'); // 'ALL' | 'COMPLETED' | 'PENDING'
      const [isUserMgmtModalOpen, setIsUserMgmtModalOpen] = useState(false);
      const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
      const [isNewTaskModalOpen, setIsNewTaskModalOpen] = useState(false);
      const [newTaskDefaults, setNewTaskDefaults] = useState({});
      const [selectedTask, setSelectedTask] = useState(null);
      const [taskToDelete, setTaskToDelete] = useState(null);
      const [auctionAlertModal, setAuctionAlertModal] = useState(null);
      const [isParticipantsOpen, setIsParticipantsOpen] = useState(false);
      const [isFilterDropdownOpen, setIsFilterDropdownOpen] = useState(false);
      const [isUserDropdownOpen, setIsUserDropdownOpen] = useState(false);
      const [isSidebarOpen, setIsSidebarOpen] = useState(true);

      const handleRegisterUser = (newUser) => {
        setUsers(prev => [...prev, newUser]);
      };

      // Drag selection state
      const [dragState, setDragState] = useState(null);

      useEffect(() => {
        localStorage.setItem('cal_users', JSON.stringify(users));
      }, [users]);

      useEffect(() => {
        localStorage.setItem('cal_projects', JSON.stringify(projects));
      }, [projects]);

      useEffect(() => {
        localStorage.setItem('cal_tasks', JSON.stringify(tasks));
      }, [tasks]);

      useEffect(() => {
        localStorage.setItem('cal_wa_logs', JSON.stringify(whatsAppLogs));
      }, [whatsAppLogs]);

      useEffect(() => {
        const interval = setInterval(() => setNow(new Date()), 60000);
        return () => clearInterval(interval);
      }, []);

      // Date Nav
      const handlePrevDate = () => {
        const newD = new Date(currentDate);
        if (viewMode === 'DAY') newD.setDate(newD.getDate() - 1);
        else if (viewMode === 'WEEK') newD.setDate(newD.getDate() - 7);
        else if (viewMode === 'MONTH') newD.setMonth(newD.getMonth() - 1);
        else newD.setDate(newD.getDate() - 1);
        setCurrentDate(newD);
      };

      const handleNextDate = () => {
        const newD = new Date(currentDate);
        if (viewMode === 'DAY') newD.setDate(newD.getDate() + 1);
        else if (viewMode === 'WEEK') newD.setDate(newD.getDate() + 7);
        else if (viewMode === 'MONTH') newD.setMonth(newD.getMonth() + 1);
        else newD.setDate(newD.getDate() + 1);
        setCurrentDate(newD);
      };

      const handleToday = () => setCurrentDate(new Date());

      // Date helpers
      const getStartOfWeek = (d) => {
        const date = new Date(d);
        const day = date.getDay();
        const diff = date.getDate() - day + (day === 0 ? -6 : 1);
        return new Date(date.setDate(diff));
      };

      const startOfWeek = getStartOfWeek(currentDate);
      const weekDays = Array.from({ length: 7 }, (_, i) => {
        const d = new Date(startOfWeek);
        d.setDate(d.getDate() + i);
        return d;
      });

      const hours = Array.from({ length: 13 }, (_, i) => i + 8); // 8 AM - 8 PM
      const getTaskAssignedIds = (t) => {
        if (!t) return [];
        if (Array.isArray(t.assignedToIds) && t.assignedToIds.length > 0) {
          return t.assignedToIds;
        }
        return t.assignedToId ? [t.assignedToId] : [];
      };

      const getTaskAssignedUsers = (t, userList = users) => {
        const ids = getTaskAssignedIds(t);
        return userList.filter(u => ids.includes(u.id));
      };

      const ROW_HEIGHT = 80;

      // Open Auction Tasks count
      const openAuctions = tasks.filter(t => t.status === 'OPEN_AUCTION' || getTaskAssignedIds(t).length === 0);

      // Filtered Tasks
      const filteredTasks = tasks.filter((t) => {
        if (t.status === 'CANCELLED') return false;
        if (selectedProjectFilter && t.projectId !== selectedProjectFilter) return false;

        const assignedIds = getTaskAssignedIds(t);
        const assignedUsers = getTaskAssignedUsers(t, users);
        const hasContractor = assignedUsers.some(u => u.role === 'THIRD_PARTY');

        // Si es Asunto Personal: es visible para el usuario asignado/creador Y TAMBIÉN para el Jefe (para gestión de bloqueo de horario)
        if (t.isPersonal) {
          if (currentUser.role === 'BOSS') {
            if (selectedUserFilter) {
              return assignedIds.includes(selectedUserFilter);
            }
            return true;
          }
          return assignedIds.includes(currentUser.id) || t.createdById === currentUser.id;
        }

        // Subastas libres son visibles para todos
        if (t.status === 'OPEN_AUCTION' || assignedIds.length === 0) return true;

        if (currentUser.role === 'BOSS') {
          if (selectedUserFilter) {
            return assignedIds.includes(selectedUserFilter);
          }
          return true;
        }

        // Si es Empleado Técnico: ve sus tareas, las que creó Y TAMBIÉN los trabajos de contratistas 3eros
        if (currentUser.role === 'EMPLOYEE') {
          return assignedIds.includes(currentUser.id) || t.createdById === currentUser.id || hasContractor;
        }

        // Si es Contratista 3ero: ve sus trabajos asignados o creados por él
        return assignedIds.includes(currentUser.id) || t.createdById === currentUser.id;
      });

      // Cell Click & Drag Handlers
      const handleCellClick = (day, hour = 9) => {
        const yyyy = day.getFullYear();
        const mm = String(day.getMonth() + 1).padStart(2, '0');
        const dd = String(day.getDate()).padStart(2, '0');
        const startH = hour < 10 ? `0${hour}:00` : `${hour}:00`;
        const nextH = hour + 2 > 20 ? 20 : hour + 2;
        const endH = nextH < 10 ? `0${nextH}:00` : `${nextH}:00`;

        setNewTaskDefaults({
          dateStr: `${yyyy}-${mm}-${dd}`,
          startTimeStr: startH,
          endTimeStr: endH
        });
        setIsParticipantsOpen(false);
        setIsNewTaskModalOpen(true);
      };

      const handleMouseDownCell = (day, hour) => {
        setDragState({
          isDragging: true,
          day,
          startHour: hour,
          currentHour: hour
        });
      };

      const handleMouseEnterCell = (hour) => {
        if (dragState && dragState.isDragging) {
          setDragState(prev => ({ ...prev, currentHour: hour }));
        }
      };

      const handleMouseUpCell = () => {
        if (dragState && dragState.isDragging && dragState.day && dragState.startHour !== undefined) {
          const day = dragState.day;
          const startH = Math.min(dragState.startHour, dragState.currentHour ?? dragState.startHour);
          const endH = Math.max(dragState.startHour, dragState.currentHour ?? dragState.startHour) + 1;

          const yyyy = day.getFullYear();
          const mm = String(day.getMonth() + 1).padStart(2, '0');
          const dd = String(day.getDate()).padStart(2, '0');

          setNewTaskDefaults({
            dateStr: `${yyyy}-${mm}-${dd}`,
            startTimeStr: startH < 10 ? `0${startH}:00` : `${startH}:00`,
            endTimeStr: endH < 10 ? `0${endH}:00` : `${endH}:00`
          });
          setIsParticipantsOpen(false);
          setIsNewTaskModalOpen(true);
        }
        setDragState(null);
      };

      // Create Task Logic (Multi-Participant & Private Personal Events)
      const handleCreateTask = ({ title, description, location, dateStr, startTimeStr, endTimeStr, assignedToIds = [], isPersonal, isAuction, projectId }) => {
        const start = new Date(`${dateStr}T${startTimeStr}:00`);
        const end = new Date(`${dateStr}T${endTimeStr}:00`);

        if (start >= end) {
          setAppAlert({
            type: 'ERROR',
            title: '⚠️ Horario Inválido',
            message: 'La hora de inicio de la tarea debe ser anterior a la hora de fin.'
          });
          return false;
        }

        const isPersonalTask = Boolean(isPersonal);
        const isUnassignedAuction = Boolean(isAuction) && !isPersonalTask;

        // Si es Asunto Personal, se asigna ÚNICAMENTE al usuario actual
        const finalAssignedIds = isPersonalTask
          ? [currentUser.id]
          : (isUnassignedAuction ? [] : (assignedToIds.length > 0 ? assignedToIds : [currentUser.id]));

        // Restricción: Los contratistas 3eros no pueden asignar tareas a empleados ni al jefe
        if (currentUser.role === 'THIRD_PARTY') {
          const hasCompanyStaff = finalAssignedIds.some(id => {
            const u = users.find(user => user.id === id);
            return u && (u.role === 'EMPLOYEE' || u.role === 'BOSS');
          });
          if (hasCompanyStaff) {
            setAppAlert({
              type: 'ERROR',
              title: '🚫 Restricción de Asignación',
              message: 'Los contratistas y partners 3eros no pueden asignar trabajos al personal de la empresa.'
            });
            return false;
          }
        }

        if (!isUnassignedAuction) {
          // Check Overlap for EVERY selected worker/participant
          for (const targetUserId of finalAssignedIds) {
            const targetUser = users.find(u => u.id === targetUserId);
            const overlap = tasks.find(t => {
              if (t.status === 'CANCELLED') return false;
              const taskAssignedIds = getTaskAssignedIds(t);
              if (!taskAssignedIds.includes(targetUserId)) return false;
              const tStart = new Date(t.startTime);
              const tEnd = new Date(t.endTime);
              return tStart < end && tEnd > start;
            });

            if (overlap) {
              const conflictStart = new Date(overlap.startTime).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
              const conflictEnd = new Date(overlap.endTime).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
              setAppAlert({
                type: 'WARNING',
                title: `⚠️ Horario Bloqueado para ${targetUser?.name || 'Participante'}`,
                message: `El usuario ya tiene agendado el trabajo '${overlap.title}' de ${conflictStart} a ${conflictEnd}.\n\nPuedes seleccionar a otros participantes o ajustar el horario.`
              });
              return false;
            }
          }
        }

        const newTask = {
          id: 'task-' + Date.now(),
          title: isUnassignedAuction && !title.includes('SUBASTA') ? `⚡ SUBASTA: ${title}` : title,
          description,
          location,
          startTime: `${dateStr}T${startTimeStr}:00`,
          endTime: `${dateStr}T${endTimeStr}:00`,
          status: isUnassignedAuction ? 'OPEN_AUCTION' : 'PENDING',
          isPersonal: Boolean(isPersonal),
          isAuction: isUnassignedAuction,
          assignedToId: isUnassignedAuction ? null : finalAssignedIds[0],
          assignedToIds: isUnassignedAuction ? [] : finalAssignedIds,
          createdById: currentUser.id,
          projectId: isPersonalTask ? null : (projectId || null)
        };

        setTasks(prev => [...prev, newTask]);

        // Auto WhatsApp Notification for all participants
        if (!isUnassignedAuction) {
          const newPrompts = [];
          finalAssignedIds.forEach(targetUserId => {
            if (targetUserId !== currentUser.id) {
              const targetUser = users.find(u => u.id === targetUserId);
              if (targetUser) {
                const formattedDate = start.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
                const otherNames = users
                  .filter(u => finalAssignedIds.includes(u.id) && u.id !== targetUser.id)
                  .map(u => u.name)
                  .join(', ');

                const msg = `NUEVA ASIGNACIÓN DE TRABAJO\n\nHola ${targetUser.name}, ${currentUser.name} te ha asignado al trabajo:\nTrabajo: ${newTask.title}\nFecha: ${formattedDate}\nHorario: ${startTimeStr} - ${endTimeStr}\n${otherNames ? `Participantes: ${targetUser.name}, ${otherNames}\n` : ''}${location ? `Ubicación: ${location}\n` : ''}${description ? `Detalles: ${description}\n` : ''}\nNota: Horario reservado en tu agenda.`;

                const cleanPhone = (targetUser.phone || '').replace(/[^0-9]/g, '');
                const waUrl = cleanPhone
                  ? `https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`
                  : `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;

                const logEntry = {
                  id: 'log-' + Date.now() + Math.random(),
                  recipientName: targetUser.name,
                  recipientPhone: targetUser.phone,
                  message: msg,
                  waUrl: waUrl,
                  status: 'DIRECT_WHATSAPP',
                  sentAt: new Date().toISOString()
                };

                setWhatsAppLogs(prev => [logEntry, ...prev]);
                newPrompts.push(logEntry);
              }
            }
          });

          if (newPrompts.length > 0) {
            setWhatsAppPromptQueue(prev => [...prev, ...newPrompts]);
          }
        }

        return true;
      };

      // ⚡ CLAIM AUCTION TASK LOGIC (FIRST COME FIRST SERVED - THIRD PARTY ONLY)
      const handleClaimAuctionTask = (taskId) => {
        const targetTask = tasks.find(t => t.id === taskId);
        if (!targetTask) return;

        // 1. Role Restriction: Only THIRD_PARTY (Contratistas 3eros & Partners) can claim open auctions!
        if (currentUser.role !== 'THIRD_PARTY') {
          setAuctionAlertModal({
            type: 'ERROR',
            title: '🚫 Subasta Exclusiva para Contratistas 3eros',
            message: `Hola ${currentUser.name}. Las subastas abiertas están destinadas únicamente para contratistas y partners externos (3eros). Tu usuario actual (${currentUser.role === 'BOSS' ? 'Jefe / Admin' : 'Empleado Técnico'}) no puede postularse ni ganar subastas.`
          });
          return;
        }

        // 2. Check if already claimed
        if (targetTask.assignedToId && targetTask.status !== 'OPEN_AUCTION') {
          setAuctionAlertModal({
            type: 'ERROR',
            title: '⚠️ Trabajo Ya Reclamado',
            message: 'Este trabajo ya fue reclamado por otro contratista o partner.'
          });
          return;
        }

        // 3. Check schedule conflict for claiming user
        const start = new Date(targetTask.startTime);
        const end = new Date(targetTask.endTime);

        const overlap = tasks.find(t => {
          if (t.id === taskId || t.status === 'CANCELLED' || t.assignedToId !== currentUser.id) return false;
          const tStart = new Date(t.startTime);
          const tEnd = new Date(t.endTime);
          return tStart < end && tEnd > start;
        });

        if (overlap) {
          const conflictStart = new Date(overlap.startTime).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
          const conflictEnd = new Date(overlap.endTime).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
          setAuctionAlertModal({
            type: 'ERROR',
            title: '⚠️ Horario Ocupado en tu Itinerario',
            message: `No puedes reclamar este trabajo porque ya tienes agendada la tarea '${overlap.title}' de ${conflictStart} a ${conflictEnd} en tu agenda personal.`
          });
          return;
        }

        // 4. Assign task to current user!
        setTasks(prev => prev.map(t => {
          if (t.id === taskId) {
            return {
              ...t,
              assignedToId: currentUser.id,
              status: 'PENDING',
              isAuction: false
            };
          }
          return t;
        }));

        // Trigger WhatsApp confirmation
        const formattedDate = start.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
        const startH = start.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        const endH = end.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

        const msg = `TRABAJO RECLAMADO (SUBASTA)\n\nHola ${currentUser.name}, has reclamado exitosamente el trabajo:\nTrabajo: ${targetTask.title}\nFecha: ${formattedDate}\nHorario: ${startH} - ${endH}\n${targetTask.location ? `Ubicación: ${targetTask.location}\n` : ''}\nNota: Este horario ha sido reservado en tu itinerario.`;

        setWhatsAppLogs(prev => [
          {
            id: 'log-' + Date.now(),
            recipientName: currentUser.name,
            recipientPhone: currentUser.phone,
            message: msg,
            status: 'DIRECT_WHATSAPP',
            sentAt: new Date().toISOString()
          },
          ...prev
        ]);

        setSelectedTask(null);

        // 5. Open victory modal in app style
        setAuctionAlertModal({
          type: 'SUCCESS',
          title: '🏆 ¡Ganaste la Subasta de Trabajo!',
          message: `¡Felicidades, ${currentUser.name}! Fuiste el primero en reclamarlo. El trabajo ha sido asignado a tu perfil y tu horario ha quedado bloqueado automáticamente.`,
          taskTitle: targetTask.title,
          dateStr: formattedDate,
          timeStr: `${startH} - ${endH}`,
          location: targetTask.location
        });
      };

      // Employee Joining / Leaving Contractor Tasks
      const handleJoinTask = (taskId) => {
        const targetTask = tasks.find(t => t.id === taskId);
        if (!targetTask) return;

        const start = new Date(targetTask.startTime);
        const end = new Date(targetTask.endTime);

        // Check schedule conflict for current employee
        const overlap = tasks.find(t => {
          if (t.id === taskId || t.status === 'CANCELLED') return false;
          const taskAssignedIds = getTaskAssignedIds(t);
          if (!taskAssignedIds.includes(currentUser.id)) return false;
          const tStart = new Date(t.startTime);
          const tEnd = new Date(t.endTime);
          return tStart < end && tEnd > start;
        });

        if (overlap) {
          const conflictStart = new Date(overlap.startTime).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
          const conflictEnd = new Date(overlap.endTime).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
          setAuctionAlertModal({
            type: 'ERROR',
            title: '⚠️ Horario Ocupado en tu Agenda',
            message: `No puedes unirte a este trabajo porque ya tienes la tarea '${overlap.title}' de ${conflictStart} a ${conflictEnd}.`
          });
          return;
        }

        // Add employee to task
        setTasks(prev => prev.map(t => {
          if (t.id === taskId) {
            const currentIds = getTaskAssignedIds(t);
            const newIds = Array.from(new Set([...currentIds, currentUser.id]));
            return {
              ...t,
              assignedToIds: newIds,
              assignedToId: newIds[0]
            };
          }
          return t;
        }));

        setSelectedTask(null);

        // Simulated WhatsApp log for joining
        const formattedDate = start.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
        const startH = start.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        const endH = end.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

        const msg = `INCORPORACIÓN A TRABAJO\n\nEl empleado ${currentUser.name} se ha unido al trabajo:\nTrabajo: ${targetTask.title}\nFecha: ${formattedDate}\nHorario: ${startH} - ${endH}\nUbicación: ${targetTask.location || 'No especificada'}\nNota: Horario reservado en el itinerario de ${currentUser.name}.`;

        setWhatsAppLogs(prev => [
          {
            id: 'log-' + Date.now(),
            recipientName: currentUser.name,
            recipientPhone: currentUser.phone,
            message: msg,
            status: 'DIRECT_WHATSAPP',
            sentAt: new Date().toISOString()
          },
          ...prev
        ]);

        setAuctionAlertModal({
          type: 'SUCCESS',
          title: '🤝 ¡Te has unido al trabajo!',
          message: `Te has incorporado como participante en '${targetTask.title}'. Tu horario ha sido reservado automáticamente.`,
          taskTitle: targetTask.title,
          dateStr: formattedDate,
          timeStr: `${startH} - ${endH}`,
          location: targetTask.location
        });
      };

      const handleLeaveTask = (taskId) => {
        setTasks(prev => prev.map(t => {
          if (t.id === taskId) {
            const currentIds = getTaskAssignedIds(t);
            const newIds = currentIds.filter(id => id !== currentUser.id);
            return {
              ...t,
              assignedToIds: newIds,
              assignedToId: newIds[0] || null
            };
          }
          return t;
        }));

        setSelectedTask(null);

        setAuctionAlertModal({
          type: 'SUCCESS',
          title: '👋 Te has retirado del trabajo',
          message: `Has dejado de formar parte de este trabajo. Tu horario ha quedado libre.`
        });
      };

      // Task Status Update & Delete
      const handleUpdateTaskStatus = (taskId, newStatus) => {
        let completionAlert = null;

        setTasks(prev => prev.map(t => {
          if (t.id === taskId) {
            let updatedTask = { ...t, status: newStatus };

            if (newStatus === 'COMPLETED') {
              const nowTime = new Date();
              const scheduledEnd = new Date(t.endTime);

              updatedTask.completedAt = nowTime.toISOString();
              updatedTask.completedBy = currentUser.name;

              // If completing before scheduled end time, update endTime to current time to free schedule
              if (nowTime < scheduledEnd && nowTime > new Date(t.startTime)) {
                const pad = (n) => String(n).padStart(2, '0');
                const formattedNowEnd = `${nowTime.getFullYear()}-${pad(nowTime.getMonth() + 1)}-${pad(nowTime.getDate())}T${pad(nowTime.getHours())}:${pad(nowTime.getMinutes())}:00`;

                updatedTask.originalEndTime = t.endTime;
                updatedTask.endTime = formattedNowEnd;

                const savedMinutes = Math.round((scheduledEnd - nowTime) / (1000 * 60));
                const origEndH = scheduledEnd.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
                const newEndH = nowTime.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

                completionAlert = {
                  type: 'SUCCESS',
                  title: '⏰ ¡Horario Liberado Anticipadamente!',
                  message: `El trabajo '${t.title}' fue completado a las ${newEndH} (antes del fin programado de las ${origEndH}).\n\n✨ ¡Se han liberado ${savedMinutes} minutos en la agenda para nuevas reservaciones!`,
                  taskTitle: t.title,
                  dateStr: nowTime.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }),
                  timeStr: `Hora final ajustada a ${newEndH} (Ahorro: ${savedMinutes} min)`
                };
              } else {
                completionAlert = {
                  type: 'SUCCESS',
                  title: '✅ Trabajo Completado',
                  message: `El trabajo '${t.title}' ha sido completado y registrado exitosamente en la Bitácora de Actividades.`,
                  taskTitle: t.title,
                  dateStr: nowTime.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }),
                  timeStr: `Finalizado por ${currentUser.name}`
                };
              }
            }

            return updatedTask;
          }
          return t;
        }));

        setSelectedTask(null);

        if (completionAlert) {
          setAuctionAlertModal(completionAlert);
        }
      };

      const handleDeleteTask = (taskId) => {
        const targetTask = tasks.find(t => t.id === taskId);
        if (targetTask) {
          const assignedUsers = getTaskAssignedUsers(targetTask, users);
          const hasContractor = assignedUsers.some(u => u.role === 'THIRD_PARTY');
          if (currentUser.role === 'EMPLOYEE' && hasContractor) {
            setAuctionAlertModal({
              type: 'ERROR',
              title: '🚫 Acción Restringida',
              message: 'Los empleados técnicos no tienen permitido eliminar los trabajos de los contratistas o partners 3eros.'
            });
            setTaskToDelete(null);
            return;
          }
        }
        setTasks(prev => prev.filter(t => t.id !== taskId));
        setTaskToDelete(null);
        setSelectedTask(null);
      };

      // Month View Days
      const getMonthDays = (d) => {
        const year = d.getFullYear();
        const month = d.getMonth();
        const firstDayOfMonth = new Date(year, month, 1);
        const dayOfWeek = firstDayOfMonth.getDay();
        const startOffset = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
        const startDate = new Date(firstDayOfMonth);
        startDate.setDate(startDate.getDate() - startOffset);

        return Array.from({ length: 35 }, (_, i) => {
          const day = new Date(startDate);
          day.setDate(day.getDate() + i);
          return day;
        });
      };
      const monthDays = getMonthDays(currentDate);

      // Current Time Red Line Position
      const nowHour = now.getHours() + now.getMinutes() / 60;
      const showRedLine = nowHour >= 8 && nowHour <= 20;
      const redLineTopPx = (nowHour - 8) * ROW_HEIGHT;

      // Overlap Layout Helper
      const getTaskColumnLayout = (task, dayTasks) => {
        const taskStart = new Date(task.startTime).getTime();
        const taskEnd = new Date(task.endTime).getTime();

        const overlaps = dayTasks.filter(t => {
          const s = new Date(t.startTime).getTime();
          const e = new Date(t.endTime).getTime();
          return s < taskEnd && e > taskStart;
        });

        overlaps.sort((a, b) => new Date(a.startTime).getTime() - new Date(b.startTime).getTime() || a.id.localeCompare(b.id));

        const totalCols = overlaps.length;
        const colIndex = overlaps.findIndex(t => t.id === task.id);
        const widthPercent = 100 / totalCols;
        const leftPercent = colIndex * widthPercent;

        return {
          left: `${leftPercent}%`,
          width: `calc(${widthPercent}% - 2px)`
        };
      };

      const completedTasks = tasks.filter(t => t.status === 'COMPLETED');
      const pendingUsersCount = users.filter(u => u.status === 'PENDING_APPROVAL' || u.role === 'PENDING' || u.pendingRoleChange).length;

      if (!isLoggedIn) {
        return <LoginScreen users={users} onLogin={handleLogin} onRegister={handleRegisterUser} />;
      }

      return (
        <div className="min-h-screen flex flex-col bg-gray-950" onMouseUp={handleMouseUpCell}>
          {/* HEADER PRINCIPAL UNIFICADO Y OPTIMIZADO */}
          <header className="bg-gray-900/90 border-b border-gray-800 sticky top-0 z-30 backdrop-blur-md px-4 lg:px-8 h-14 flex items-center justify-between shadow-xl">
            {/* Left: Minimal Brand Badge & Quick Access Modals */}
            <div className="flex items-center space-x-3 text-xs">
              <div className="flex items-center space-x-2 font-extrabold text-white text-sm tracking-tight pr-2 border-r border-gray-800">
                <span className="text-base">📅</span>
                <span>Calendario</span>
              </div>

              <div className="hidden sm:flex items-center space-x-2">
                <button
                  onClick={() => setIsCompletedLogsModalOpen(true)}
                  className="px-2.5 py-1.5 bg-gray-950 hover:bg-gray-900 border border-gray-800 text-gray-300 hover:text-white rounded-xl font-semibold transition-all flex items-center space-x-1 cursor-pointer"
                >
                  <span>📋 Bitácora</span>
                  <span className="bg-indigo-900 text-indigo-200 rounded-full px-1.5 text-[10px] font-bold">{completedTasks.length}</span>
                </button>

                <button
                  onClick={() => setIsProjectsModalOpen(true)}
                  className="px-2.5 py-1.5 bg-gray-950 hover:bg-gray-900 border border-gray-800 text-gray-300 hover:text-white rounded-xl font-semibold transition-all flex items-center space-x-1 cursor-pointer"
                >
                  <span>📂 Proyectos</span>
                  <span className="bg-purple-900 text-purple-200 rounded-full px-1.5 text-[10px] font-bold">{projects.length}</span>
                </button>

                    title: form.title.value,

                      <label className="block text-xs font-semibold text-gray-300 mb-1">Hora Fin</label>

                            <span>✋ ¡RECLAMAR Y ASIGNARME ESTE TRABAJO!</span>

                          </p>

                          </div>
                          <button
                            onClick={() => handleClaimAuctionTask(selectedTask.id)}
                            className="w-full py-2 bg-gray-950 border border-gray-800 text-gray-400 font-semibold text-xs rounded-xl hover:border-amber-600/50 transition-all flex items-center justify-center gap-1.5"
                          >
                            <span>🔒 Subasta Solo para 3eros (Intentar Reclamar)</span>
                          </button>
                        </>
                      )}
                    </div>
                  ) : (
                    <div className="bg-gray-950 p-3 rounded-xl border border-gray-800 space-y-2">

                      <div className="space-y-1.5">
                        {getTaskAssignedUsers(selectedTask, users).map(u => {
                          const cleanPhone = (u.phone || '').replace(/[^0-9]/g, '');
                          const taskDate = new Date(selectedTask.startTime).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
                          const startH = new Date(selectedTask.startTime).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
                          const endH = new Date(selectedTask.endTime).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
                          const msgText = `NOTIFICACIÓN DE TRABAJO\nHola ${u.name}, recordatorio del trabajo:\nTrabajo: ${selectedTask.title}\nFecha: ${taskDate}\nHorario: ${startH} - ${endH}\n${selectedTask.location ? `Ubicación: ${selectedTask.location}\n` : ''}${selectedTask.description ? `Detalles: ${selectedTask.description}\n` : ''}`;
                          const waUrl = cleanPhone ? `https://wa.me/${cleanPhone}?text=${encodeURIComponent(msgText)}` : `https://api.whatsapp.com/send?text=${encodeURIComponent(msgText)}`;

                          return (
                            <div key={u.id} className="flex justify-between items-center bg-gray-900 border border-gray-800 p-2.5 rounded-xl text-xs gap-2">
                              <div>
                                <p className="font-bold text-gray-200">

                                rel="noopener noreferrer"

                                <span>📱 WhatsApp</span>
                                <span>➔</span>
                              </a>
                            </div>
                          );

                      <p className="font-mono text-indigo-400 text-xs pt-1">⏰ {new Date(selectedTask.startTime).toLocaleString('es-ES')} - {new Date(selectedTask.endTime).toLocaleTimeString('es-ES')}</p>
                    </div>
                  )}

                  {/* BOTÓN UNIRSE / ACOMPAÑAR TRABAJO PARA EMPLEADOS */}
                  {(() => {
                    if (currentUser.role !== 'EMPLOYEE' || selectedTask.status === 'CANCELLED' || selectedTask.status === 'OPEN_AUCTION') {
                      return null;
                    }
                    const assignedIds = getTaskAssignedIds(selectedTask);
                    const assignedUsers = getTaskAssignedUsers(selectedTask, users);
                    const hasContractor = assignedUsers.some(u => u.role === 'THIRD_PARTY');
                    const isAlreadyJoined = assignedIds.includes(currentUser.id);

                    if (hasContractor && !isAlreadyJoined) {
                      return (
                        <div className="p-3 bg-indigo-950/70 border border-indigo-700/80 rounded-xl space-y-2">
                          <p className="text-xs text-indigo-200 font-semibold">

                          </p>
                          <button
                            onClick={() => handleJoinTask(selectedTask.id)}
                            className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl shadow transition-all flex items-center justify-center gap-1.5"
                          >
                            <span>➕ Unirme a este Trabajo (Acompañar al Contratista)</span>
                          </button>
                        </div>
                      );

                      return (
                        <button
                          onClick={() => handleLeaveTask(selectedTask.id)}
                          className="w-full py-1.5 bg-gray-900 border border-gray-700 text-gray-300 hover:text-white font-semibold text-xs rounded-xl transition-all"
                        >
                          🚶 Retirarme de este Trabajo
                        </button>
                      );
                    }

                    return null;
                  })()}

                    const taskProject = projects.find(p => p.id === selectedTask.projectId);

                      <div className="p-3 bg-purple-950/60 border border-purple-800/80 rounded-xl text-xs flex items-center justify-between">

                        <span className="font-extrabold text-white bg-purple-900/80 px-2.5 py-1 rounded-lg border border-purple-700">
                          {taskProject.name}
                        </span>
                      </div>

                  })()}

                    <div className="p-2 bg-purple-950/60 border border-purple-800/80 rounded-xl text-xs font-semibold text-purple-200 flex items-center gap-1.5">
                      <span>🟣 ASUNTO PERSONAL</span>
                    </div>
                  )}

                    <div className="pt-2 border-t border-gray-800 space-y-2">

                                  const displayedTasks = folderTaskTab === 'COMPLETED'
                                    ? completedTasks
                                    : (folderTaskTab === 'PENDING' ? pendingTasks : projectTasks);

                                  if (displayedTasks.length === 0) {
                                    return (
                                      <div className="p-6 text-center text-gray-500 bg-gray-900/40 rounded-xl border border-gray-800/80 text-xs">
                                        📭 No hay tareas {folderTaskTab === 'COMPLETED' ? 'completadas' : (folderTaskTab === 'PENDING' ? 'pendientes' : '')} en esta carpeta de proyecto.
                                      </div>
                                    );
                                  }

                                  return (
                                    <div className="space-y-2 max-h-80 overflow-y-auto pr-1">
                                      {displayedTasks.map(task => {
                                        const assignedUsers = getTaskAssignedUsers(task, users);
                                        const isDone = task.status === 'COMPLETED';

                                        return (
                                          <div
                                            key={task.id}
                                            className={`p-3 rounded-xl border text-xs flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 transition-all ${
                                              isDone
                                                ? 'bg-emerald-950/20 border-emerald-900/50 text-emerald-100 shadow-sm'
                                                : 'bg-gray-900 border-gray-800 text-gray-200'
                                            }`}
                                          >
                                            <div className="space-y-1 flex-1">
                                              <div className="flex items-center space-x-2">
                                                <span className={`px-2 py-0.5 rounded text-[10px] font-extrabold ${
                                                  isDone
                                                    ? 'bg-emerald-950 text-emerald-300 border border-emerald-700/80'
                                                    : (task.status === 'IN_PROGRESS'
                                                      ? 'bg-blue-950 text-blue-300 border border-blue-700/80'
                                                      : 'bg-amber-950 text-amber-300 border border-amber-700/80')
                                                }`}>
                                                  {isDone ? '✅ REALIZADA' : (task.status === 'IN_PROGRESS' ? '🔄 EN PROGRESO' : '⏳ AGENDADA')}
                                                </span>
                                                <h6 className="font-extrabold text-white text-xs tracking-tight">{task.title}</h6>
                                              </div>

                                              <div className="flex flex-wrap items-center gap-x-3 gap-y-1 text-[11px] text-gray-400 mt-1">
                                                <span>⏰ {new Date(task.startTime).toLocaleDateString('es-ES')} ({new Date(task.startTime).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })} - {new Date(task.endTime).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })})</span>
                                                {task.location && <span>📍 {task.location}</span>}
                                                <span>👤 Realizado/Asignado: <strong className="text-gray-200 font-semibold">{assignedUsers.map(u => u.name).join(', ') || 'Sin Asignar'}</strong></span>
                                              </div>

                                              {task.description && (
                                                <p className="text-[11px] text-gray-300 bg-gray-950/70 p-2 rounded-lg border border-gray-800/80 mt-1.5 italic">
                                                  "{task.description}"
                                                </p>
                                              )}
                                            </div>
                                          </div>
                                        );
                                      })}
                                    </div>
                                  );
                                })()}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>

                {/* Footer del Modal */}
                <div className="p-3.5 bg-gray-900 border-t border-gray-800 flex justify-between items-center text-xs">
                  <span className="text-gray-400">Total Proyectos: <strong className="text-white">{projects.length}</strong></span>
                  <button onClick={() => setIsProjectsModalOpen(false)} className="px-4 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-200 font-semibold rounded-xl cursor-pointer">
                    Cerrar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal de Editar Mi Perfil */}
          <UserProfileModal
            isOpen={isProfileModalOpen}
            onClose={() => setIsProfileModalOpen(false)}
            currentUser={currentUser}
            setCurrentUser={setCurrentUser}
            setUsers={setUsers}
          />

          {/* Modal de Gestión de Usuarios (Sólo Jefe) */}
          <UserManagementModal
            isOpen={isUserMgmtModalOpen}
            onClose={() => setIsUserMgmtModalOpen(false)}
            users={users}
            setUsers={setUsers}
            setAppAlert={setAppAlert}
            currentUser={currentUser}
            setCurrentUser={setCurrentUser}
          />

          {/* MODAL EMERGENTE DE CONFIRMACIÓN DE ENVÍO POR WHATSAPP */}
          {whatsAppPromptQueue.length > 0 && (() => {
            const currentPrompt = whatsAppPromptQueue[0];
            const remainingCount = whatsAppPromptQueue.length - 1;

            return (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-950/85 backdrop-blur-md">
                <div className="bg-gray-900 border border-emerald-500/70 w-full max-w-md rounded-3xl p-6 shadow-2xl text-center space-y-4 relative overflow-hidden">
                  
                  <div className="w-14 h-14 bg-emerald-950 border border-emerald-700 text-emerald-300 rounded-2xl flex items-center justify-center mx-auto text-3xl font-black shadow-lg shadow-emerald-950/50">
                    💬
                  </div>

                  <div>
                    <h3 className="font-extrabold text-white text-base tracking-tight">¿Enviar notificación por WhatsApp?</h3>
                    <p className="text-xs text-gray-300 mt-1 leading-relaxed">
                      Se asignó la tarea a <strong className="text-emerald-300">{currentPrompt.recipientName}</strong> ({currentPrompt.recipientPhone}). ¿Deseas abrir WhatsApp para enviarle el mensaje?
                    </p>
                  </div>

                  <div className="bg-gray-950/90 border border-gray-800 rounded-2xl p-3.5 text-left text-xs text-emerald-100 whitespace-pre-wrap font-sans leading-relaxed max-h-48 overflow-y-auto">
                    {currentPrompt.message}
                  </div>

                  {remainingCount > 0 && (
                    <p className="text-[11px] text-amber-400 font-semibold">
                      📋 Notificación 1 de {whatsAppPromptQueue.length} ({remainingCount} destinatario(s) más pendiente(s))
                    </p>
                  )}

                  <div className="flex items-center justify-center space-x-3 pt-2">
                    <button
                      type="button"
                      onClick={() => {
                        setWhatsAppPromptQueue(prev => prev.slice(1));
                      }}
                      className="px-4 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold text-xs rounded-xl transition-all cursor-pointer"
                    >
                      Omitir (No enviar)
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        window.open(currentPrompt.waUrl, '_blank');
                        setWhatsAppPromptQueue(prev => prev.slice(1));
                      }}
                      className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-600/30 flex items-center space-x-1.5 transition-all cursor-pointer"
                    >
                      <span>📱 Abrir WhatsApp y Enviar</span>
                      <span>➔</span>
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* MODAL DE ALERTA Y CONFIRMACIÓN UNIFICADO DE LA APP (DISEÑO ESMERALDA & ORO) */}
          {appAlert && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-950/85 backdrop-blur-md">
              <div className={`bg-gray-900 border ${
                appAlert.type === 'CONFIRM'
                  ? 'border-amber-600/70 shadow-amber-950/40'
                  : appAlert.type === 'WARNING'
                  ? 'border-amber-500/70 shadow-amber-500/20'
                  : appAlert.type === 'SUCCESS'
                  ? 'border-emerald-500/70 shadow-emerald-500/20'
                  : 'border-red-800/80 shadow-red-950/50'
              } w-full max-w-md rounded-2xl p-6 shadow-2xl text-center space-y-4 relative overflow-hidden`}>
                
                <div className={`w-14 h-14 rounded-2xl flex items-center justify-center mx-auto text-2xl font-black shadow-lg ${
                  appAlert.type === 'CONFIRM' || appAlert.type === 'WARNING'
                    ? 'bg-amber-950 border border-amber-700 text-amber-300'
                    : appAlert.type === 'SUCCESS'
                    ? 'bg-emerald-950 border border-emerald-700 text-emerald-300'
                    : 'bg-red-950 border border-red-800 text-red-400'
                }`}>
                  {appAlert.type === 'CONFIRM' ? '❓' : appAlert.type === 'WARNING' ? '⚠️' : appAlert.type === 'SUCCESS' ? '✅' : '🚫'}
                </div>

                <div>
                  <h3 className="font-extrabold text-white text-base tracking-tight">{appAlert.title}</h3>
                  <p className="text-xs text-gray-300 mt-2 leading-relaxed whitespace-pre-wrap">{appAlert.message}</p>
                </div>

                {appAlert.type === 'CONFIRM' ? (
                  <div className="flex items-center justify-center space-x-3 pt-2">
                    <button
                      onClick={() => setAppAlert(null)}
                      className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold rounded-xl transition-all cursor-pointer"
                    >
                      {appAlert.cancelText || 'Cancelar'}
                    </button>
                    <button
                      onClick={() => {
                        if (appAlert.onConfirm) appAlert.onConfirm();
                        setAppAlert(null);
                      }}
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-emerald-600/30 transition-all cursor-pointer"
                    >
                      {appAlert.confirmText || 'Aceptar'}
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => setAppAlert(null)}
                    className="w-full py-2.5 bg-gray-800 hover:bg-gray-700 text-white font-semibold text-xs rounded-xl transition-all cursor-pointer"
                  >
                    Entendido
                  </button>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
