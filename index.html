                                        )}
                                      </div>
                                      <p className="text-xs text-gray-300">
                                        {isOpenAuction && !isCompleted
                                          ? '⚡ SUBASTA LIBRE PARA CONTRATISTAS'
                                          : `👥 Asignados (${assignedUsers.length}): ${assignedUsers.map(u => u.name.split(' ')[0]).join(', ')}`}
                                      </p>
                                    </div>
                                    <span className={`text-xs font-mono px-2.5 py-1 rounded-lg font-bold ${
                                      isCompleted ? 'bg-emerald-600 text-white' : 'bg-gray-900'
                                    }`}>
                                      {isCompleted ? '✅ COMPLETADO' : isOpenAuction ? '⚡ RECLAMAR' : t.status}
                                    </span>
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* MONTH VIEW */}
                {viewMode === 'MONTH' && (
                  <div className="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-xl">
                    <div className="grid grid-cols-7 border-b border-gray-800 bg-gray-950 text-xs font-bold text-gray-400 text-center py-3">
                      <span>LUN</span><span>MAR</span><span>MIÉ</span><span>JUE</span><span>VIE</span><span>SÁB</span><span>DOM</span>
                    </div>
                    <div className="grid grid-cols-7 divide-x divide-y divide-gray-800/60 min-h-[600px]">
                      {monthDays.map((day, idx) => {
                        const dayStr = day.toDateString();
                        const isCurrentMonth = day.getMonth() === currentDate.getMonth();
                        const dayTasks = filteredTasks.filter(t => new Date(t.startTime).toDateString() === dayStr);

                        return (
                          <div
                            key={idx}
                            onClick={() => handleCellClick(day, 9)}
                            onDragOver={(e) => e.preventDefault()}
                            onDrop={(e) => {
                              e.preventDefault();
                              const dragged = tasks.find(x => x.id === draggedTaskId);
                              const keepHour = dragged ? new Date(dragged.startTime).getHours() : 9;
                              handleDropTaskOnSlot(day, keepHour);
                            }}
                            className={`min-h-[110px] p-2 cursor-pointer hover:bg-indigo-950/20 flex flex-col justify-between ${!isCurrentMonth ? 'opacity-40' : ''}`}
                          >
                            <div className="flex justify-between items-center">
                              <span className="text-xs font-bold">{day.getDate()}</span>
                              {dayTasks.length > 0 && <span className="text-[10px] font-semibold text-gray-400">{dayTasks.length} trab.</span>}
                            </div>
                            <div className="space-y-1">
                              {dayTasks.slice(0, 2).map(t => {
                                const isCompleted = t.status === 'COMPLETED';
                                const isOpenAuction = t.status === 'OPEN_AUCTION' || getTaskAssignedIds(t).length === 0;
                                return (
                                  <div
                                    key={t.id}
                                    draggable={!isCompleted}
                                    onDragStart={(e) => {
                                      e.stopPropagation();
                                      setDraggedTaskId(t.id);
                                    }}
                                    onDragEnd={() => setDraggedTaskId(null)}
                                    onClick={(e) => { e.stopPropagation(); setSelectedTask(t); }}
                                    className={`p-1 text-[10px] border rounded truncate font-semibold cursor-grab active:cursor-grabbing ${
                                      isCompleted
                                        ? 'bg-emerald-950 border-emerald-500 text-emerald-200'
                                        : isOpenAuction
                                        ? 'bg-amber-950 border-amber-500 text-amber-200'
                                        : t.isPersonal
                                        ? 'bg-purple-950 border-purple-700 text-purple-200'
                                        : 'bg-indigo-950 border-indigo-800 text-indigo-200'
                                    }`}
                                  >
                                    {isCompleted ? `✅ ${t.title}` : t.isPersonal ? `🟣 ${t.title}` : (t.recurrenceLabel ? `🔄 ${t.title}` : t.title)}
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                          auctionWrapper.style.pointerEvents = isPersonalChecked ? 'none' : 'auto';

                          projectWrapper.style.pointerEvents = isPersonalChecked ? 'none' : 'auto';

                <div className="flex justify-between items-center border-b border-gray-800 pb-3 gap-2">

                    </div>
                  </div>
                  <button onClick={() => setIsProjectsModalOpen(false)} className="text-gray-400 hover:text-white p-1 rounded-lg hover:bg-gray-800 cursor-pointer">✕</button>
                </div>

                <div className="p-4 overflow-y-auto flex-1 space-y-5 bg-gray-950/60">
                  {/* Formulario Crear Nuevo Proyecto */}
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      const form = e.target;
                      const name = form.projectName.value.trim();

                      if (!name) return;

                      const newPrj = {
                        id: 'prj-' + Date.now(),
                        name: name,
                        color: 'indigo'
                      };

                      setProjects(prev => [...prev, newPrj]);
                      form.reset();
                    }}
                    className="bg-gray-900/90 border border-purple-900/40 rounded-2xl p-4 space-y-3 shadow-md"
                  >
                    <h4 className="font-bold text-white text-xs flex items-center gap-1.5">
                      <span>+ Registrar Nuevo Proyecto</span>
                    </h4>
                    <div className="flex gap-2">
                      <input
                        name="projectName"
                        required
                        placeholder="Nombre Completo del Proyecto (Ej. Remodelación Sede Central)"
                        className="flex-1 bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2 text-xs text-gray-100 focus:border-purple-600 focus:outline-none"
                      />
                      <button
                        type="submit"
                        className="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-purple-600/30 transition-all cursor-pointer shrink-0"
                      >
                        + Crear Proyecto
                      </button>
                    </div>
                  </form>

                  {/* SECCIÓN DE CARPETAS POR PROYECTO */}
                  <div className="space-y-3">
                    <div className="flex justify-between items-center">
                      <h4 className="font-extrabold text-gray-300 text-xs uppercase tracking-wider flex items-center space-x-1.5">
                        <span>📁 Carpetas de Proyectos Registrados ({projects.length})</span>
                      </h4>
                      <span className="text-[11px] text-purple-300/90 font-medium">Haz clic en una carpeta para explorarla</span>
                    </div>

                    <div className="space-y-3">
                      {projects.map(p => {
                        const projectTasks = tasks.filter(t => t.projectId === p.id && t.status !== 'CANCELLED');
                        const completedTasks = projectTasks.filter(t => t.status === 'COMPLETED');
                        const pendingTasks = projectTasks.filter(t => t.status !== 'COMPLETED');
                        const isOpen = openFolderId === p.id;
                        const progressPercent = projectTasks.length > 0 ? Math.round((completedTasks.length / projectTasks.length) * 100) : 0;

                        return (
                          <div key={p.id} className="bg-gray-900/90 border border-gray-800 hover:border-purple-800/80 rounded-2xl overflow-hidden shadow-lg transition-all">
                            {/* Pestaña / Encabezado de la Carpeta */}
                            <div
                              onClick={() => setOpenFolderId(isOpen ? null : p.id)}
                              className="p-3.5 bg-gradient-to-r from-gray-900 via-gray-900 to-purple-950/30 hover:to-purple-950/60 cursor-pointer flex flex-col sm:flex-row sm:items-center justify-between gap-3 select-none"
                            >
                              <div className="flex items-center space-x-3">
                                <div className={`w-9 h-9 rounded-xl border flex items-center justify-center text-lg shrink-0 ${
                                  isOpen ? 'bg-purple-950 border-purple-700 text-purple-300 shadow-md' : 'bg-gray-950 border-gray-800 text-purple-400'
                                }`}>
                                  {isOpen ? '📂' : '📁'}
                                </div>
                                <div>
                                  <h5 className="font-extrabold text-white text-sm tracking-tight">{p.name}</h5>
                                  <div className="flex items-center space-x-2 mt-0.5 text-[11px] text-gray-400">
                                    <span className="text-emerald-400 font-bold">✅ {completedTasks.length} completadas</span>
                                    <span>•</span>
                                    <span className="text-amber-400 font-bold">⏳ {pendingTasks.length} pendientes</span>
                                    <span>•</span>
                                    <span>📋 {projectTasks.length} total</span>
                                  </div>
                                </div>
                              </div>

                              <div className="flex items-center space-x-4 self-end sm:self-auto">
                                {/* Barra Mini de Progreso */}
                                <div className="w-28 space-y-1">
                                  <div className="flex justify-between text-[10px] font-bold text-gray-400">
                                    <span>Avance</span>
                                    <span className="text-emerald-400 font-extrabold">{progressPercent}%</span>
                                  </div>
                                  <div className="w-full h-1.5 bg-gray-950 rounded-full overflow-hidden border border-gray-800">
                                    <div className="h-full bg-gradient-to-r from-emerald-600 to-teal-400 transition-all duration-500" style={{ width: `${progressPercent}%` }}></div>
                                  </div>
                                </div>

                                <button
                                  type="button"
                                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all border ${
                                    isOpen
                                      ? 'bg-purple-950 border-purple-700 text-purple-200'
                                      : 'bg-gray-950 hover:bg-gray-800 border-gray-800 text-gray-300'
                                  }`}
                                >
                                  {isOpen ? 'Cerrar Carpeta 📁' : 'Abrir Carpeta 📂'}
                                </button>

                                <button
                                  type="button"
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    handleDeleteProject(p);
                                  }}
                                  className="px-2.5 py-1.5 bg-red-950/60 hover:bg-red-900 text-red-400 hover:text-white font-bold text-xs rounded-xl border border-red-900/80 transition-all cursor-pointer flex items-center space-x-1 shrink-0"
                                  title="Eliminar Proyecto"
                                >
                                  <span>🗑️</span>
                                  <span className="hidden sm:inline">Eliminar</span>
                                </button>
                              </div>
                            </div>

                            {/* CONTENIDO DENTRO DE LA CARPETA ABIERTA */}
                            {isOpen && (
                              <div className="p-4 bg-gray-950/90 space-y-3.5 border-t border-purple-950/60">
                                {/* Barra de Filtro de la Carpeta & Acciones */}
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 pb-2 border-b border-gray-800/80 text-xs">
                                  <div className="flex items-center space-x-1.5">
                                    <span className="text-gray-400 font-semibold text-[11px] mr-1">Filtrar en esta carpeta:</span>
                                    <button
                                      onClick={(e) => { e.stopPropagation(); setFolderTaskTab('ALL'); }}
                                      className={`px-2.5 py-1 rounded-lg font-bold text-[11px] cursor-pointer ${
                                        folderTaskTab === 'ALL' ? 'bg-purple-600 text-white shadow' : 'bg-gray-900 text-gray-400 hover:text-white'
                                      }`}
                                    >
                                      Todas ({projectTasks.length})
                                    </button>
                                    <button
                                      onClick={(e) => { e.stopPropagation(); setFolderTaskTab('COMPLETED'); }}
                                      className={`px-2.5 py-1 rounded-lg font-bold text-[11px] cursor-pointer ${
                                        folderTaskTab === 'COMPLETED' ? 'bg-emerald-600 text-white shadow' : 'bg-gray-900 text-gray-400 hover:text-white'
                                      }`}
                                    >
                                      ✅ Realizadas ({completedTasks.length})
                                    </button>
                                    <button
                                      onClick={(e) => { e.stopPropagation(); setFolderTaskTab('PENDING'); }}
                                      className={`px-2.5 py-1 rounded-lg font-bold text-[11px] cursor-pointer ${
                                        folderTaskTab === 'PENDING' ? 'bg-amber-600 text-white shadow' : 'bg-gray-900 text-gray-400 hover:text-white'
                                      }`}
                                    >
                                      ⏳ En Progreso ({pendingTasks.length})
                                    </button>
                                  </div>

                                  <button
                                    onClick={() => {
                                      setSelectedProjectFilter(p.id);
                                      setIsProjectsModalOpen(false);
                                    }}
                                    className="px-3 py-1 bg-indigo-950 hover:bg-indigo-900 text-indigo-200 border border-indigo-700/60 font-bold text-xs rounded-xl flex items-center space-x-1 cursor-pointer"
                                  >
                                    <span>🔍 Filtrar en Calendario</span>
                                  </button>
                                </div>

                                {/* LISTADO DE TAREAS EN LA CARPETA */}
                                {(() => {
                                  const displayedTasks = folderTaskTab === 'COMPLETED'
                                    ? completedTasks
                                    : (folderTaskTab === 'PENDING' ? pendingTasks : projectTasks);

                                  if (displayedTasks.length === 0) {
                                    return (
                                      <div className="p-6 text-center text-gray-500 bg-gray-900/40 rounded-xl border border-gray-800/80 text-xs">
                                        📭 No hay tareas {folderTaskTab === 'COMPLETED' ? 'completadas' : (folderTaskTab === 'PENDING' ? 'pendientes' : '')} en esta carpeta de proyecto.
                                      </div>
                                    );
                                  }

                                  return (
                                    <div className="space-y-2 max-h-80 overflow-y-auto pr-1">
                                      {displayedTasks.map(task => {
                                        const assignedUsers = getTaskAssignedUsers(task, users);
                                        const isDone = task.status === 'COMPLETED';

                                        return (
                                          <div
                                            key={task.id}
                                            className={`p-3.5 rounded-2xl border text-xs flex flex-col sm:flex-row sm:items-center justify-between gap-3 transition-all ${
                                              isDone
                                                ? 'bg-emerald-950/30 border-emerald-800/60 text-emerald-100 shadow-md'
                                                : 'bg-gray-900 border-gray-800 text-gray-200 hover:border-gray-700'
                                            }`}
                                          >
                                            <div className="space-y-1.5 flex-1">
                                              <div className="flex flex-wrap items-center gap-2">
                                                <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider ${
                                                  isDone
                                                    ? 'bg-emerald-950 text-emerald-300 border border-emerald-700/80'
                                                    : (task.status === 'IN_PROGRESS'
                                                      ? 'bg-blue-950 text-blue-300 border border-blue-700/80'
                                                      : 'bg-amber-950 text-amber-300 border border-amber-700/80')
                                                }`}>
                                                  {isDone ? '✅ REALIZADA' : (task.status === 'IN_PROGRESS' ? '🔄 EN PROGRESO' : '⏳ AGENDADA')}
                                                </span>
                                                <h6 className="font-extrabold text-white text-xs tracking-tight">{task.title}</h6>
                                              </div>

                                              <div className="flex flex-wrap items-center gap-x-3 gap-y-1 text-[11px] text-gray-400">
                                                <span>⏰ {new Date(task.startTime).toLocaleDateString('es-ES')} ({new Date(task.startTime).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })} - {new Date(task.endTime).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })})</span>
                                                {task.location && (
                                                  <a
                                                    href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(task.location)}`}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="text-emerald-400 hover:text-emerald-300 font-semibold flex items-center gap-1 underline"
                                                  >
                                                    📍 {task.location} 🗺️
                                                  </a>
                                                )}
                                                <span>👤 Realizado/Asignado: <strong className="text-gray-200 font-semibold">{assignedUsers.map(u => u.name).join(', ') || 'Sin Asignar'}</strong></span>
                                              </div>

                                              {task.description && (
                                                <p className="text-[11px] text-gray-300 bg-gray-950/70 p-2 rounded-lg border border-gray-800/80 italic">
                                                  "{task.description}"
                                                </p>
                                              )}
                                            </div>

                                            {/* Botones de Acción Directa: Completar Tarea */}
                                            <div className="flex items-center space-x-2 shrink-0 pt-2 sm:pt-0 border-t sm:border-t-0 border-gray-800/60 justify-end">
                                              {isDone ? (
                                                <button
                                                  type="button"
                                                  onClick={() => handleUpdateTaskStatus(task.id, 'PENDING')}
                                                  className="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700 font-bold text-xs rounded-xl transition-all cursor-pointer flex items-center space-x-1"
                                                  title="Reabrir o marcar como pendiente"
                                                >
                                                  <span>↩️ Reabrir Tarea</span>
                                                </button>
                                              ) : (
                                                <button
                                                  type="button"
                                                  onClick={() => handleUpdateTaskStatus(task.id, 'COMPLETED')}
                                                  className="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs rounded-xl shadow-lg shadow-emerald-600/30 transition-all cursor-pointer flex items-center space-x-1.5"
                                                  title="Marcar como realizada / completada"
                                                >
                                                  <span>✓</span>
                                                  <span>Marcar Realizada</span>
                                                </button>
                                              )}

                                              <button
                                                type="button"
                                                onClick={() => {
                                                  setSelectedTask(task);
                                                  setIsProjectsModalOpen(false);
                                                }}
                                                className="px-2.5 py-1.5 bg-gray-950 hover:bg-gray-800 text-gray-300 border border-gray-800 font-bold text-xs rounded-xl transition-all cursor-pointer"
                                                title="Ver detalle completo"
                                              >
                                                <span>🔍 Ver</span>
                                              </button>
                                            </div>
                                          </div>
                                        );
                                      })}
                                    </div>
                                  );
                                })()}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>

                {/* Footer del Modal */}
                <div className="p-3.5 bg-gray-900 border-t border-gray-800 flex justify-between items-center text-xs">
                  <span className="text-gray-400">Total Proyectos: <strong className="text-white">{projects.length}</strong></span>
                  <button onClick={() => setIsProjectsModalOpen(false)} className="px-4 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-200 font-semibold rounded-xl cursor-pointer">
                    Cerrar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal de Editar Mi Perfil */}
          <UserProfileModal
            isOpen={isProfileModalOpen}
            onClose={() => setIsProfileModalOpen(false)}
            currentUser={currentUser}
            setCurrentUser={setCurrentUser}
            setUsers={setUsers}
          />

          {/* Modal de Gestión de Usuarios (Sólo Jefe) */}
          <UserManagementModal
            isOpen={isUserMgmtModalOpen}
            onClose={() => setIsUserMgmtModalOpen(false)}
            users={users}
            setUsers={setUsers}
            setAppAlert={setAppAlert}
            currentUser={currentUser}
            setCurrentUser={setCurrentUser}
          />

          {/* MODAL EMERGENTE DE CONFIRMACIÓN DE ENVÍO POR WHATSAPP */}
          {whatsAppPromptQueue.length > 0 && (() => {
            const currentPrompt = whatsAppPromptQueue[0];
            const remainingCount = whatsAppPromptQueue.length - 1;

            return (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-950/85 backdrop-blur-md">
                <div className="bg-gray-900 border border-emerald-500/70 w-full max-w-md rounded-3xl p-6 shadow-2xl text-center space-y-4 relative overflow-hidden">
                  
                  <div className="w-14 h-14 bg-emerald-950 border border-emerald-700 text-emerald-300 rounded-2xl flex items-center justify-center mx-auto text-3xl font-black shadow-lg shadow-emerald-950/50">
                    💬
                  </div>

                  <div>
                    <h3 className="font-extrabold text-white text-base tracking-tight">¿Enviar notificación por WhatsApp?</h3>
                    <p className="text-xs text-gray-300 mt-1 leading-relaxed">
                      Se asignó la tarea a <strong className="text-emerald-300">{currentPrompt.recipientName}</strong> ({currentPrompt.recipientPhone}). ¿Deseas abrir WhatsApp para enviarle el mensaje?
                    </p>
                  </div>

                  <div className="bg-gray-950/90 border border-gray-800 rounded-2xl p-3.5 text-left text-xs text-emerald-100 whitespace-pre-wrap font-sans leading-relaxed max-h-48 overflow-y-auto">
                    {currentPrompt.message}
                  </div>

                  {remainingCount > 0 && (
                    <p className="text-[11px] text-amber-400 font-semibold">
                      📋 Notificación 1 de {whatsAppPromptQueue.length} ({remainingCount} destinatario(s) más pendiente(s))
                    </p>
                  )}

                  <div className="flex items-center justify-center space-x-3 pt-2">
                    <button
                      type="button"
                      onClick={() => {
                        setWhatsAppPromptQueue(prev => prev.slice(1));
                      }}
                      className="px-4 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold text-xs rounded-xl transition-all cursor-pointer"
                    >
                      Omitir (No enviar)
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        window.open(currentPrompt.waUrl, '_blank');
                        setWhatsAppPromptQueue(prev => prev.slice(1));
                      }}
                      className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-600/30 flex items-center space-x-1.5 transition-all cursor-pointer"
                    >
                      <span>📱 Abrir WhatsApp y Enviar</span>
                      <span>➔</span>
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* MODAL DE ALERTA Y CONFIRMACIÓN UNIFICADO DE LA APP (DISEÑO ESMERALDA & ORO) */}
          {appAlert && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-950/85 backdrop-blur-md">
              <div className={`bg-gray-900 border ${
                appAlert.type === 'CONFIRM'
                  ? 'border-amber-600/70 shadow-amber-950/40'
                  : appAlert.type === 'WARNING'
                  ? 'border-amber-500/70 shadow-amber-500/20'
                  : appAlert.type === 'SUCCESS'
                  ? 'border-emerald-500/70 shadow-emerald-500/20'
                  : 'border-red-800/80 shadow-red-950/50'
              } w-full max-w-md rounded-2xl p-6 shadow-2xl text-center space-y-4 relative overflow-hidden`}>
                
                <div className={`w-14 h-14 rounded-2xl flex items-center justify-center mx-auto text-2xl font-black shadow-lg ${
                  appAlert.type === 'CONFIRM' || appAlert.type === 'WARNING'
                    ? 'bg-amber-950 border border-amber-700 text-amber-300'
                    : appAlert.type === 'SUCCESS'
                    ? 'bg-emerald-950 border border-emerald-700 text-emerald-300'
                    : 'bg-red-950 border border-red-800 text-red-400'
                }`}>
                  {appAlert.type === 'CONFIRM' ? '❓' : appAlert.type === 'WARNING' ? '⚠️' : appAlert.type === 'SUCCESS' ? '✅' : '🚫'}
                </div>

                <div>
                  <h3 className="font-extrabold text-white text-base tracking-tight">{appAlert.title}</h3>
                  <p className="text-xs text-gray-300 mt-2 leading-relaxed whitespace-pre-wrap">{appAlert.message}</p>
                </div>

                {appAlert.type === 'CONFIRM' ? (
                  <div className="flex items-center justify-center space-x-3 pt-2">
                    <button
                      onClick={() => setAppAlert(null)}
                      className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold rounded-xl transition-all cursor-pointer"
                    >
                      {appAlert.cancelText || 'Cancelar'}
                    </button>
                    <button
                      onClick={() => {
                        if (appAlert.onConfirm) appAlert.onConfirm();
                        setAppAlert(null);
                      }}
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-emerald-600/30 transition-all cursor-pointer"
                    >
                      {appAlert.confirmText || 'Aceptar'}
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => setAppAlert(null)}
                    className="w-full py-2.5 bg-gray-800 hover:bg-gray-700 text-white font-semibold text-xs rounded-xl transition-all cursor-pointer"
                  >
                    Entendido
                  </button>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
