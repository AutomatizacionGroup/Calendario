    function formatWhatsAppPhone(phone) {
      if (!phone) return '';
      let cleaned = String(phone).replace(/[^0-9]/g, '');
      if (!cleaned) return '';

      // Formato local de Venezuela: 0412..., 0414..., 0424..., 0416..., 0426... -> 584...
      if (/^04[12][246]/.test(cleaned) || /^04\d{8,9}$/.test(cleaned)) {
        cleaned = '58' + cleaned.substring(1);
      }
      // Formato de 10 dígitos sin el '0' inicial (ej. 4125594984), anteponer '58'
      else if (cleaned.length === 10 && /^4[12][246]/.test(cleaned)) {
        cleaned = '58' + cleaned;
      }
      // Formato que empieza con ceros iniciales
      else if (cleaned.startsWith('0')) {
        cleaned = cleaned.replace(/^0+/, '');
      }

      return cleaned;
    }

    // --- CUSTOM DATE PICKER DROPDOWN COMPONENT ---
    function CustomDatePicker({ name = "dateStr", defaultValue, value, onChange, required = false, align = "left" }) {
      const [selectedDateStr, setSelectedDateStr] = useState(() => {
        return value || defaultValue || new Date().toISOString().split('T')[0];
      });
      const [isOpen, setIsOpen] = useState(false);
      const [viewDate, setViewDate] = useState(() => {
        const initial = value || defaultValue || new Date().toISOString().split('T')[0];
        const parts = initial.split('-');
        if (parts.length === 3) {
          return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
        }
        return new Date();
      });

      const containerRef = useRef(null);
      const alignClass = align === "right" ? "right-0" : "left-0";

      useEffect(() => {
        if (value) {
          setSelectedDateStr(value);
          const parts = value.split('-');
          if (parts.length === 3) {
            setViewDate(new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10)));
          }
        } else if (defaultValue) {
          setSelectedDateStr(defaultValue);
          const parts = defaultValue.split('-');
          if (parts.length === 3) {
            setViewDate(new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10)));
          }
        }
      }, [value, defaultValue]);

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (containerRef.current && !containerRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      const handleSelectDate = (d) => {
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const dateString = `${yyyy}-${mm}-${dd}`;
        setSelectedDateStr(dateString);
        if (onChange) onChange(dateString);
        setIsOpen(false);
      };

      const getCalendarDays = () => {
        const year = viewDate.getFullYear();
        const month = viewDate.getMonth();
        const firstDay = new Date(year, month, 1);
        const dayOfWeek = firstDay.getDay();
        const startOffset = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
        const startDate = new Date(firstDay);
        startDate.setDate(startDate.getDate() - startOffset);

        return Array.from({ length: 35 }, (_, i) => {
          const d = new Date(startDate);
          d.setDate(d.getDate() + i);
          return d;
        });
      };

      const calendarDays = getCalendarDays();
      const todayStr = new Date().toISOString().split('T')[0];

      const formatDisplayDate = (dStr) => {
        if (!dStr) return '';
        const parts = dStr.split('-');
        if (parts.length !== 3) return dStr;
        const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
        return d.toLocaleDateString('es-ES', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
      };

      return (
        <div className="relative w-full" ref={containerRef}>
          <input type="hidden" name={name} value={selectedDateStr} required={required} />
          
          <button
            type="button"
            onClick={() => setIsOpen(prev => !prev)}

              {formatDisplayDate(selectedDateStr)}
            </span>
            <span className="text-gray-400 group-hover:text-emerald-400 text-xs ml-1 shrink-0">📅</span>
          </button>

                  {viewDate.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })}
                </span>
                <div className="flex items-center space-x-1">
                  <button
                    type="button"
                    onClick={() => {
                      const d = new Date(viewDate);
                      d.setMonth(d.getMonth() - 1);
                      setViewDate(d);
                    }}
                    className="p-1 text-gray-400 hover:text-white rounded-lg hover:bg-gray-800"
                  >◄</button>
                  <button
                    type="button"
                    onClick={() => {
                      const today = new Date();
                      setViewDate(today);
                      handleSelectDate(today);
                    }}
                    className="px-1.5 py-0.5 text-[10px] text-indigo-400 hover:bg-indigo-950 rounded font-bold"
                  >Hoy</button>
                  <button
                    type="button"
                    onClick={() => {
                      const d = new Date(viewDate);
                      d.setMonth(d.getMonth() + 1);
                      setViewDate(d);
                    }}
                    className="p-1 text-gray-400 hover:text-white rounded-lg hover:bg-gray-800"
                  >►</button>
                </div>
              </div>

              <div className="pt-2">
                <div className="grid grid-cols-7 text-[10px] font-bold text-gray-500 text-center mb-1">
                  <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
                </div>

                <div className="grid grid-cols-7 gap-0.5 text-xs text-center">
                  {calendarDays.map((d, idx) => {
                    const yyyy = d.getFullYear();
                    const mm = String(d.getMonth() + 1).padStart(2, '0');
                    const dd = String(d.getDate()).padStart(2, '0');
                    const dStr = `${yyyy}-${mm}-${dd}`;

                    const isSelected = dStr === selectedDateStr;
                    const isToday = dStr === todayStr;
                    const isCurrentMonth = d.getMonth() === viewDate.getMonth();

                    return (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => handleSelectDate(d)}
                        className={`py-1.5 rounded-lg text-[11px] font-medium transition-all ${
                          isSelected
                            ? 'bg-emerald-600 text-white font-bold shadow-md shadow-emerald-600/40'
                            : isToday
                            ? 'bg-indigo-950 text-indigo-300 border border-indigo-700/80 font-bold'
                            : isCurrentMonth
                            ? 'text-gray-300 hover:bg-gray-800 hover:text-white'
                            : 'text-gray-600 hover:bg-gray-800/40'
                        }`}
                      >
                        {d.getDate()}
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- CUSTOM TIME PICKER DROPDOWN COMPONENT ---
    function CustomTimePicker({ name, defaultValue = "09:00", value, onChange, required = false, align = "left" }) {
      const [selectedTime, setSelectedTime] = useState(() => value || defaultValue || "09:00");
      const [isOpen, setIsOpen] = useState(false);
      const containerRef = useRef(null);
      const alignClass = align === "right" ? "right-0" : "left-0";

      useEffect(() => {
        if (value) setSelectedTime(value);
        else if (defaultValue) setSelectedTime(defaultValue);
      }, [value, defaultValue]);

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (containerRef.current && !containerRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      const format12Hour = (time24) => {
        if (!time24) return "09:00 AM";
        const [hStr, mStr] = time24.split(':');
        let h = parseInt(hStr, 10);
        const m = mStr || "00";
        if (isNaN(h)) return time24;
        const period = h >= 12 ? 'PM' : 'AM';
        h = h % 12;
        if (h === 0) h = 12;
        const displayH = String(h).padStart(2, '0');
        return `${displayH}:${m} ${period}`;
      };

      const handleSelectTime = (time24Str) => {
        setSelectedTime(time24Str);
        if (onChange) onChange(time24Str);
        setIsOpen(false);
      };

      const popularTimes = [];
      for (let h = 8; h <= 20; h++) {
        const h24_1 = String(h).padStart(2, '0');
        popularTimes.push(`${h24_1}:00`);
        if (h < 20) {
          popularTimes.push(`${h24_1}:30`);
        }
      }

      const [currHStr, currMStr] = (selectedTime || "09:00").split(':');
      const currH = parseInt(currHStr || "9", 10);
      const currM = parseInt(currMStr || "0", 10);

      const isPM = currH >= 12;
      const h12 = currH % 12 === 0 ? 12 : currH % 12;

      const setHourMinute = (newH12, newM, newIsPM) => {
        let h24 = newH12 % 12;
        if (newIsPM) h24 += 12;
        const hStr = String(h24).padStart(2, '0');
        const mStr = String(newM).padStart(2, '0');
        handleSelectTime(`${hStr}:${mStr}`);
      };

      return (
        <div className="relative w-full" ref={containerRef}>
          <input type="hidden" name={name} value={selectedTime} required={required} />

          <button
            type="button"
            onClick={() => setIsOpen(prev => !prev)}
            className="w-full bg-gray-950 border border-gray-800 hover:border-emerald-500/70 rounded-xl px-2.5 py-1.5 text-xs text-gray-100 flex items-center justify-between transition-all cursor-pointer shadow-sm group focus:outline-none focus:border-emerald-500"
          >
            <span className="font-semibold text-gray-200 truncate font-mono">
              {format12Hour(selectedTime)}
            </span>
            <span className="text-gray-400 group-hover:text-emerald-400 text-xs ml-1 shrink-0">🕒</span>
          </button>

          {isOpen && (
            <div className={`absolute ${alignClass} mt-1.5 w-64 bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl p-3 z-50 divide-y divide-gray-800/60 backdrop-blur-md`}>
              <div className="pb-2.5 space-y-2">
                <div className="text-[10px] font-bold uppercase tracking-wider text-gray-400 text-center">
                  Seleccionar Horario Exacto
                </div>
                <div className="flex items-center justify-center space-x-1.5">
                  <select
                    value={h12}
                    onChange={(e) => setHourMinute(parseInt(e.target.value, 10), currM, isPM)}
                    className="bg-gray-950 border border-gray-700 rounded-lg px-2 py-1 text-xs text-white font-bold font-mono focus:border-emerald-500 focus:outline-none cursor-pointer"
                  >
                    {Array.from({ length: 12 }, (_, i) => i + 1).map(num => (
                      <option key={num} value={num}>{String(num).padStart(2, '0')}</option>
                    ))}
                  </select>

                  <span className="text-gray-400 font-bold">:</span>

                  <select
                    value={currM}
                    onChange={(e) => setHourMinute(h12, parseInt(e.target.value, 10), isPM)}
                    className="bg-gray-950 border border-gray-700 rounded-lg px-2 py-1 text-xs text-white font-bold font-mono focus:border-emerald-500 focus:outline-none cursor-pointer"
                  >
                    {[0, 15, 30, 45].map(min => (
                      <option key={min} value={min}>{String(min).padStart(2, '0')}</option>
                    ))}
                  </select>

                  <div className="flex bg-gray-950 p-0.5 rounded-lg border border-gray-700 text-[10px] font-bold">
                    <button
                      type="button"
                      onClick={() => setHourMinute(h12, currM, false)}
                      className={`px-1.5 py-0.5 rounded ${!isPM ? 'bg-indigo-600 text-white' : 'text-gray-400 hover:text-white'}`}
                    >
                      AM
                    </button>
                    <button
                      type="button"
                      onClick={() => setHourMinute(h12, currM, true)}
                      className={`px-1.5 py-0.5 rounded ${isPM ? 'bg-indigo-600 text-white' : 'text-gray-400 hover:text-white'}`}
                    >
                      PM
                    </button>
                  </div>
                </div>
              </div>

              <div className="pt-2 space-y-1">
                <div className="text-[10px] font-bold uppercase tracking-wider text-gray-400">
                  Horarios Frecuentes
                </div>
                <div className="grid grid-cols-3 gap-1 max-h-40 overflow-y-auto pr-1">
                  {popularTimes.map(t24 => {
                    const isSelected = t24 === selectedTime;
                    return (
                      <button
                        key={t24}
                        type="button"
                        onClick={() => handleSelectTime(t24)}
                        className={`py-1 px-1 rounded-lg text-[10px] font-mono font-medium transition-all ${
                          isSelected
                            ? 'bg-emerald-600 text-white font-bold shadow-md shadow-emerald-600/40'
                            : 'bg-gray-950 text-gray-300 hover:bg-gray-800 hover:text-white border border-gray-800/80'
                        }`}
                      >
                        {format12Hour(t24)}
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function LoginScreen({ users, onLogin, onRegister }) {
      const [activeTab, setActiveTab] = useState('CREDENTIALS'); // 'CREDENTIALS' | 'REGISTER'
      const [userOrEmailInput, setUserOrEmailInput] = useState('jefe@empresa.com');
      const [password, setPassword] = useState('123456');
      const [rememberMe, setRememberMe] = useState(true);
      const [errorMsg, setErrorMsg] = useState('');

      // Registration State & Email Verification
      const [regName, setRegName] = useState('');
      const [regUsername, setRegUsername] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regPhone, setRegPhone] = useState('');
      const [regPassword, setRegPassword] = useState('');
      const [regConfirmPassword, setRegConfirmPassword] = useState('');
      const [regStep, setRegStep] = useState('FORM'); // 'FORM' | 'VERIFY_EMAIL' | 'SUCCESS'
      const [generatedCode, setGeneratedCode] = useState('');
      const [inputCode, setInputCode] = useState('');
      const [regSuccess, setRegSuccess] = useState(false);
      const [regError, setRegError] = useState('');
      const [simulatedEmailNotice, setSimulatedEmailNotice] = useState(null);
      const [isMailboxOpen, setIsMailboxOpen] = useState(false);

      const handleCredSubmit = (e) => {
        e.preventDefault();
        setErrorMsg('');
        const query = userOrEmailInput.trim().toLowerCase();
        if (!query) {
          setErrorMsg('Por favor ingresa tu nombre de usuario o correo electrónico.');
          return;
        }

        const queryClean = userOrEmailInput.trim().toLowerCase().replace(/^@/, '');

        const target = users.find(u => 
          u.email.toLowerCase() === queryClean || 
          (u.username && u.username.toLowerCase() === queryClean) ||
          u.id.toLowerCase() === queryClean
        );

        if (!target) {
          setErrorMsg(`❌ No existe ningún usuario registrado con el correo o usuario '${userOrEmailInput}'. Verifica tus datos de acceso.`);
          return;
        }

        // Validación estricta de Contraseña
        const expectedPassword = target.password || '123456';
        if (!password || password !== expectedPassword) {
          setErrorMsg('❌ Contraseña incorrecta. Por favor verifica tu clave e intenta de nuevo.');
          return;
        }

        if (target.status === 'PENDING_APPROVAL' || target.role === 'PENDING') {
          setErrorMsg('⏳ Tu cuenta fue registrada pero está PENDIENTE DE APROBACIÓN y asignación de rol por el Jefe. Contacta a la administración para activar tu usuario.');
          return;
        }

        onLogin(target, rememberMe);
      };

      const handleDirectRegister = (e) => {
        e.preventDefault();
        setRegError('');

        if (!regName.trim() || !regUsername.trim() || !regEmail.trim() || !regPassword) {
          setRegError('Por favor completa todos los campos obligatorios (*).');
          return;
        }

        // 1. Validar Nombre Completo (al menos 3 caracteres)
        if (regName.trim().length < 3) {
          setRegError('❌ Ingresa un Nombre Completo real de al menos 3 caracteres (evita iniciales o letras aleatorias).');
          return;
        }

        // 2. Validar Nombre de Usuario (al menos 3 caracteres alfanuméricos)
        const cleanUsername = regUsername.trim().toLowerCase().replace(/\s+/g, '');
        if (cleanUsername.length < 3) {
          setRegError('❌ El Nombre de Usuario debe tener al menos 3 caracteres.');
          return;
        }

        // 3. Validar Formato Estricto de Correo Electrónico
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(regEmail.trim())) {
          setRegError('❌ Formato de correo electrónico inválido. Ingresa una dirección de correo real (ejemplo: usuario@empresa.com).');
          return;
        }

        // 4. Validar Teléfono si fue proporcionado (al menos 8 dígitos)
        if (regPhone.trim()) {
          const phoneRegex = /^\+?[0-9\s-]{8,15}$/;
          if (!phoneRegex.test(regPhone.trim())) {
            setRegError('❌ Formato de teléfono inválido. Ingresa un número de 8 a 15 dígitos (ejemplo: +525551234567).');
            return;
          }

        if (regPassword !== regConfirmPassword) {
          setRegError('Las contraseñas no coinciden.');
          return;
        }

        const emailExists = users.some(u => u.email.toLowerCase() === regEmail.trim().toLowerCase());
        if (emailExists) {

          return;

        const usernameExists = users.some(u => (u.username || '').toLowerCase() === cleanUsername);

    // --- USER PROFILE MODAL (EDIT OWN PROFILE, PASSWORD & REQUEST ROLE CHANGE) ---
    function UserProfileModal({ isOpen, onClose, currentUser, setCurrentUser, setUsers }) {
      if (!isOpen || !currentUser) return null;

      const [name, setName] = useState(currentUser.name || '');
      const [username, setUsername] = useState(currentUser.username || '');
      const [email, setEmail] = useState(currentUser.email || '');
      const [phone, setPhone] = useState(currentUser.phone || '');
      const [requestedRole, setRequestedRole] = useState(currentUser.role || 'EMPLOYEE');

      // Password state & security protocol fields
      const [oldPassword, setOldPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [passwordError, setPasswordError] = useState('');
      const [showPasswordSection, setShowPasswordSection] = useState(false);
      const [savedSuccess, setSavedSuccess] = useState('');

      const isBoss = currentUser.role === 'BOSS';

      useEffect(() => {
        if (currentUser) {
          setName(currentUser.name || '');
          setUsername(currentUser.username || '');
          setEmail(currentUser.email || '');
          setPhone(currentUser.phone || '');
          setRequestedRole(currentUser.pendingRoleChange || currentUser.role || 'EMPLOYEE');
          setOldPassword('');
          setNewPassword('');
          setConfirmPassword('');
          setPasswordError('');
          setSavedSuccess('');
          setShowPasswordSection(false);
        }
      }, [currentUser, isOpen]);

      const handleSave = (e) => {
        e.preventDefault();
        if (!name.trim() || !email.trim()) return;

        setPasswordError('');
        let updatedPassword = currentUser.password;
        let isPasswordChanged = false;

        // Protocolo de Seguridad de Cambio de Contraseña
        if (oldPassword || newPassword || confirmPassword) {
          if (!oldPassword) {
            setPasswordError('⚠️ Ingresa tu contraseña actual (vieja) para autorizar el cambio.');
            return;
          }
          if (oldPassword !== currentUser.password) {
            setPasswordError('❌ La contraseña actual (vieja) ingresada es incorrecta.');
            return;
          }
          if (!newPassword) {
            setPasswordError('⚠️ Ingresa la nueva contraseña.');
            return;
          }
          if (newPassword.length < 6) {
            setPasswordError('⚠️ La nueva contraseña debe tener al menos 6 caracteres.');
            return;
          }
          if (newPassword !== confirmPassword) {
            setPasswordError('⚠️ La nueva contraseña y la confirmación no coinciden.');
            return;
          }
          if (newPassword === oldPassword) {
            setPasswordError('⚠️ La nueva contraseña debe ser diferente a la contraseña actual.');
            return;
          }

          updatedPassword = newPassword;
          isPasswordChanged = true;
        }

        let roleChangeRequested = false;
        let updatedUser = {
          ...currentUser,
          name: name.trim(),
          username: (username.trim() || currentUser.username || '').toLowerCase().replace(/\s+/g, ''),
          email: email.trim(),
          phone: phone.trim() || '+525550000000',
          password: updatedPassword
        };

        // If current user is BOSS, role change is immediate
        if (isBoss) {
          updatedUser.role = requestedRole;
          delete updatedUser.pendingRoleChange;
        } else if (requestedRole !== currentUser.role) {
          // If non-Boss selects a different role, create a pending request for Boss approval
          updatedUser.pendingRoleChange = requestedRole;
          roleChangeRequested = true;
        }

        setUsers(prev => prev.map(u => u.id === currentUser.id ? updatedUser : u));
        setCurrentUser(updatedUser);

        if (isPasswordChanged) {
          setSavedSuccess('🔒 ¡Contraseña y perfil actualizados correctamente!');
        } else if (roleChangeRequested) {
          setSavedSuccess('📩 ¡Perfil guardado! Tu solicitud de cambio de rol ha sido enviada al Jefe para su aprobación.');
        } else {
          setSavedSuccess('✓ ¡Perfil actualizado correctamente!');
        }

        setTimeout(() => {
          setSavedSuccess('');
          onClose();
        }, 1800);
      };

      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-gray-900 border border-gray-800 rounded-3xl max-w-md w-full shadow-2xl overflow-hidden max-h-[90vh] overflow-y-auto">
            <div className="p-5 border-b border-gray-800 flex items-center justify-between bg-gray-950/60 sticky top-0 z-10 backdrop-blur">
              <div className="flex items-center space-x-3">
                <div className="p-2.5 bg-emerald-950 border border-emerald-700 text-emerald-300 rounded-2xl text-xl font-bold">
                  ✏️
                </div>
                <div>
                  <h3 className="text-base font-extrabold text-white">Editar Mi Perfil</h3>
                  <p className="text-xs text-gray-400">Actualiza tus datos, contraseña y rol</p>
                </div>
              </div>
              <button
                onClick={onClose}
                className="w-8 h-8 rounded-full bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-white flex items-center justify-center text-sm font-bold transition-colors cursor-pointer"
              >
                ✕
              </button>
            </div>

            <form onSubmit={handleSave} className="p-6 space-y-4">
              {savedSuccess && (
                <div className="p-3 bg-emerald-950/90 border border-emerald-700 text-emerald-200 rounded-xl text-xs font-bold text-center leading-relaxed">
                  {savedSuccess}
                </div>
              )}

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-gray-300 mb-1.5 uppercase tracking-wider">Nombre Completo *</label>
                  <input
                    type="text"
                    required
                    value={name}
                    onChange={e => setName(e.target.value)}
                    className="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500 font-semibold"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-300 mb-1.5 uppercase tracking-wider">Usuario (@)</label>
                  <input
                    type="text"
                    value={username}
                    onChange={e => setUsername(e.target.value)}
                    placeholder="usuario"
                    className="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500 font-semibold"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-300 mb-1.5 uppercase tracking-wider">Correo Electrónico *</label>
                <input
                  type="email"
                  required
                  value={email}

    // --- USER MANAGEMENT MODAL (FOR BOSS / ADMIN) ---
    function UserManagementModal({ isOpen, onClose, users, setUsers, setAppAlert, currentUser, setCurrentUser }) {
      if (!isOpen) return null;

      const pendingRegistrations = users.filter(u => u.status === 'PENDING_APPROVAL' || u.role === 'PENDING');
      const pendingRoleChanges = users.filter(u => u.status !== 'PENDING_APPROVAL' && u.pendingRoleChange);
      const activeUsers = users.filter(u => u.status !== 'PENDING_APPROVAL' && u.role !== 'PENDING');

      const [selectedRoles, setSelectedRoles] = useState({});
      const [editingUserId, setEditingUserId] = useState(null);
      const [editName, setEditName] = useState('');
      const [editEmail, setEditEmail] = useState('');
      const [editPhone, setEditPhone] = useState('');
      const [editRole, setEditRole] = useState('');

      const handleApproveRegistration = (user) => {
        const roleToAssign = selectedRoles[user.id] || 'THIRD_PARTY';
        setUsers(prev => prev.map(u => {
          if (u.id === user.id) {
            return {
              ...u,
              role: roleToAssign,
              status: 'ACTIVE'
            };
          }
          return u;
        }));
      };

      const handleApproveRoleChange = (userId) => {
        setUsers(prev => prev.map(u => {
          if (u.id === userId) {
            const updated = {
              ...u,
              role: u.pendingRoleChange
            };
            delete updated.pendingRoleChange;
            if (currentUser && currentUser.id === userId && setCurrentUser) {
              setCurrentUser(updated);
            }
            return updated;
          }
          return u;
        }));
      };

      const handleRejectRoleChange = (userId) => {
        setUsers(prev => prev.map(u => {
          if (u.id === userId) {
            const updated = { ...u };
            delete updated.pendingRoleChange;
            return updated;
          }
          return u;
        }));
      };

      const handleRejectUser = (userId) => {
        if (setAppAlert) {
          setAppAlert({
            type: 'CONFIRM',
            title: '🗑️ Eliminar Usuario',
            message: '¿Estás seguro de eliminar este usuario del sistema?',
            confirmText: 'Sí, Eliminar',
            cancelText: 'Cancelar',
            onConfirm: () => {
              setUsers(prev => prev.filter(u => u.id !== userId));
            }

        } else {
          setUsers(prev => prev.filter(u => u.id !== userId));
        }
      };

      const handleStartEdit = (u) => {
        setEditingUserId(u.id);
        setEditName(u.name || '');
        setEditEmail(u.email || '');
        setEditPhone(u.phone || '');
        setEditRole(u.role || 'THIRD_PARTY');
      };

      const handleSaveEdit = (userId) => {
        setUsers(prev => prev.map(u => {
          if (u.id === userId) {
            const updated = {
              ...u,
              name: editName.trim() || u.name,
              email: editEmail.trim() || u.email,
              phone: editPhone.trim() || u.phone,
              role: editRole
            };
            if (currentUser && currentUser.id === userId && setCurrentUser) {
              setCurrentUser(updated);
            }
            return updated;
          }
          return u;
        }));
        setEditingUserId(null);

    // --- MAIN APP COMPONENT ---
    function App() {
      const [appAlert, setAppAlert] = useState(null);

      // LocalStorage Sync
      const [users, setUsers] = useState(() => {
        try {
          const saved = localStorage.getItem('cal_users');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              const merged = [...parsed];
              DEFAULT_USERS.forEach(defUser => {
                const exists = merged.some(u => u.id === defUser.id || u.email.toLowerCase() === defUser.email.toLowerCase());
                if (!exists) merged.push(defUser);
              });
              return merged;
            }
          }
        } catch (e) {}
        return DEFAULT_USERS;
      });

      const [tasks, setTasks] = useState(() => {
        try {
          const saved = localStorage.getItem('cal_tasks');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch (e) {}
        return getInitialTasks();
      });

      const [whatsAppLogs, setWhatsAppLogs] = useState(() => {
        try {
          const saved = localStorage.getItem('cal_wa_logs');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) {
              return parsed.filter(log => !log.message?.includes('SOLICITUD DE REGISTRO DE CUENTA'));
            }
          }

              setAppAlert({

            };

      const handleDropTaskOnSlot = (targetDayDate, targetHour) => {

      // Create Task Logic (Multi-Participant, Recurring Tasks & Private Personal Events)
      const handleCreateTask = ({ title, description, location, mapsUrl, dateStr, startTimeStr, endTimeStr, assignedToIds = [], isPersonal, isAuction, projectId, initialSubtasks = [], budget = 0, currency = 'USD', recurrenceType = 'NONE', recurrenceCount = 1 }) => {
        const start = new Date(`${dateStr}T${startTimeStr}:00`);

            });

          }
        }

        const totalOccurrences = recurrenceType && recurrenceType !== 'NONE'
          ? Math.max(1, Math.min(24, parseInt(recurrenceCount, 10) || 1))
          : 1;

        const occurrenceDates = [];
        const [baseYear, baseMonth, baseDay] = dateStr.split('-').map(Number);

        for (let i = 0; i < totalOccurrences; i++) {
          const d = new Date(baseYear, baseMonth - 1, baseDay);
          if (recurrenceType === 'DAILY') {
            d.setDate(d.getDate() + i);
          } else if (recurrenceType === 'WEEKLY') {
            d.setDate(d.getDate() + i * 7);
          } else if (recurrenceType === 'BIWEEKLY') {
            d.setDate(d.getDate() + i * 14);
          } else if (recurrenceType === 'MONTHLY') {
            d.setMonth(d.getMonth() + i);
          }
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          occurrenceDates.push(`${yyyy}-${mm}-${dd}`);
        }

        if (!isUnassignedAuction) {
          // Check Overlap for EVERY selected worker/participant on all occurrence dates
          for (const occDateStr of occurrenceDates) {
            const occStart = new Date(`${occDateStr}T${startTimeStr}:00`);
            const occEnd = new Date(`${occDateStr}T${endTimeStr}:00`);
            for (const targetUserId of finalAssignedIds) {
              const targetUser = users.find(u => u.id === targetUserId);
              const overlap = tasks.find(t => {
                if (t.status === 'CANCELLED') return false;
                const taskAssignedIds = getTaskAssignedIds(t);
                if (!taskAssignedIds.includes(targetUserId)) return false;
                const tStart = new Date(t.startTime);
                const tEnd = new Date(t.endTime);
                return tStart < occEnd && tEnd > occStart;
              });

              if (overlap) {
                const conflictDate = new Date(overlap.startTime).toLocaleDateString('es-ES', { dateStyle: 'short' });
                const conflictStart = new Date(overlap.startTime).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
                const conflictEnd = new Date(overlap.endTime).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
                setAppAlert({
                  type: 'WARNING',
                  title: `⚠️ Horario Bloqueado para ${targetUser?.name || 'Participante'}`,
                  message: `El usuario ya tiene agendado el trabajo '${overlap.title}' el ${conflictDate} de ${conflictStart} a ${conflictEnd}.\n\nPuedes seleccionar a otros participantes o ajustar el horario.`
                });
                return false;
              }
            }
          }
        }

        const numericBudget = parseFloat(budget) > 0 ? parseFloat(budget) : 0;
        const seriesId = totalOccurrences > 1 ? 'rec-' + Date.now() : null;

            : [];

          const baseTitle = isUnassignedAuction && !title.includes('SUBASTA') ? `⚡ SUBASTA: ${title}` : title;

          return {

            description,
            location,

            status: isUnassignedAuction ? 'OPEN_AUCTION' : 'PENDING',
            isPersonal: Boolean(isPersonal),
            isAuction: isUnassignedAuction,
            assignedToId: isUnassignedAuction ? null : finalAssignedIds[0],
            assignedToIds: isUnassignedAuction ? [] : finalAssignedIds,
            createdById: currentUser.id,
            projectId: isPersonalTask ? null : (projectId || null),

                const budgetLine = newTask.budget > 0 ? `💰 Presupuesto / Pago: $${newTask.budget.toFixed(2)} ${newTask.currency}\n` : '';
                const recurrenceLine = totalOccurrences > 1 ? `🔄 Frecuencia: Repetición ${recurrenceLabels[recurrenceType]} (${totalOccurrences} sesiones programadas)\n` : '';
                const msg = `NUEVA ASIGNACIÓN DE TRABAJO\n\nHola ${targetUser.name}, ${currentUser.name} te ha asignado al trabajo:\nTrabajo: ${title}\nFecha Inicial: ${formattedDate}\nHorario: ${startTimeStr} - ${endTimeStr}\n${recurrenceLine}${budgetLine}${otherNames ? `Participantes: ${targetUser.name}, ${otherNames}\n` : ''}${location ? `Ubicación: ${location}\n` : ''}${mapsUrlFinal ? `🗺️ Mapa: ${mapsUrlFinal}\n` : ''}${description ? `Detalles: ${description}\n` : ''}\nNota: Horario reservado en tu agenda.`;

                const cleanPhone = formatWhatsAppPhone(targetUser.phone);

                  ? `https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encodeURIComponent(msg)}`
                  : `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;

                const logEntry = {
                  id: 'log-' + Date.now() + Math.random(),
                  recipientName: targetUser.name,
                  recipientPhone: targetUser.phone,

                  waUrl: waUrl,

                };

          }
        }

        return true;
      };

      // ⚡ CLAIM AUCTION TASK LOGIC (FIRST COME FIRST SERVED - THIRD PARTY ONLY)
      const handleClaimAuctionTask = (taskId) => {
        const targetTask = tasks.find(t => t.id === taskId);
        if (!targetTask) return;

        // 1. Role Restriction: Only THIRD_PARTY (Contratistas 3eros & Partners) can claim open auctions!
        if (currentUser.role !== 'THIRD_PARTY') {
          setAuctionAlertModal({
            type: 'ERROR',
            title: '🚫 Subasta Exclusiva para Contratistas 3eros',
            message: `Hola ${currentUser.name}. Las subastas abiertas están destinadas únicamente para contratistas y partners externos (3eros). Tu usuario actual (${currentUser.role === 'BOSS' ? 'Jefe / Admin' : 'Empleado Técnico'}) no puede postularse ni ganar subastas.`
          });
          return;
        }

        // 2. Check if already claimed
        if (targetTask.assignedToId && targetTask.status !== 'OPEN_AUCTION') {
          setAuctionAlertModal({
            type: 'ERROR',
            title: '⚠️ Trabajo Ya Reclamado',
            message: 'Este trabajo ya fue reclamado por otro contratista o partner.'
          });
          return;

        // 3. Check schedule conflict for claiming user
        const start = new Date(targetTask.startTime);
        const end = new Date(targetTask.endTime);

        const overlap = tasks.find(t => {
          if (t.id === taskId || t.status === 'CANCELLED' || t.assignedToId !== currentUser.id) return false;
          const tStart = new Date(t.startTime);
          const tEnd = new Date(t.endTime);
          return tStart < end && tEnd > start;
        });

        setCameraError('');
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(track => track.stop());
          streamRef.current = null;
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          if (fallbackCameraInputRef.current) {
            fallbackCameraInputRef.current.click();
          }
          return;
        }

        try {
          setIsCameraModalOpen(true);
          let stream;
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } },
              audio: false
            });
          } catch (innerErr) {
            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          }
          streamRef.current = stream;
          setTimeout(() => {
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              videoRef.current.play().catch(() => {});
            }
          }, 80);

        const canvas = document.createElement('canvas');
        const MAX_W = 700;
        const scale = vw > MAX_W ? MAX_W / vw : 1;
        canvas.width = vw * scale;
        canvas.height = vh * scale;
        const ctx = canvas.getContext('2d');

        overlaps.sort((a, b) => new Date(a.startTime).getTime() - new Date(b.startTime).getTime() || a.id.localeCompare(b.id));

        const totalCols = overlaps.length;
        const colIndex = overlaps.findIndex(t => t.id === task.id);
        const widthPercent = 100 / totalCols;
        const leftPercent = colIndex * widthPercent;

        return {
          left: `${leftPercent}%`,
          width: `calc(${widthPercent}% - 2px)`
        };
      };

      // --- MÓDULO 4 & 5: DASHBOARD DE MÉTRICAS, EXPORTACIÓN (.CSV / .ICS), VENCIDAS & COMENTARIOS ---
      const [isMetricsModalOpen, setIsMetricsModalOpen] = useState(false);

      const isTaskOverdue = (task) => {
        if (!task || task.status === 'COMPLETED' || task.status === 'CANCELLED') return false;
        const end = new Date(task.endTime);
        return end < now;
      };

      const handleAddTaskComment = (taskId, commentText) => {
        if (!commentText || !commentText.trim()) return;
        const newComment = {
          id: 'cmt-' + Date.now() + Math.random().toString(36).slice(2, 6),
          userId: currentUser.id,
          userName: currentUser.name,
          userRole: currentUser.role,
          text: commentText.trim(),
          createdAt: new Date().toISOString()
        };

        setTasks(prev => prev.map(t => {
          if (t.id === taskId) {
            const comments = Array.isArray(t.comments) ? [...t.comments, newComment] : [newComment];
            return { ...t, comments };
          }
          return t;
        }));

        setSelectedTask(prev => {
          if (prev && prev.id === taskId) {
            const comments = Array.isArray(prev.comments) ? [...prev.comments, newComment] : [newComment];
            return { ...prev, comments };
          }
          return prev;
        });
      };

      const handleExportCSV = () => {
        const headers = [
          'ID',
          'Titulo',
          'Estado',
          'Vencida',
          'Proyecto',
          'Responsables',
          'Fecha Inicio',
          'Fecha Fin',
          'Check-In Real',
          'Check-Out Real',
          'Presupuesto',
          'Moneda',
          'Estado de Pago',
          'Ubicacion',
          'Nota de Cierre'
        ];

        const escapeCsv = (val) => {
          if (val === null || val === undefined) return '""';
          const str = String(val).replace(/"/g, '""');
          return `"${str}"`;
        };

        const rows = tasks.map(t => {
          const proj = projects.find(p => p.id === t.projectId)?.name || 'General';
          const assigned = getTaskAssignedUsers(t, users).map(u => u.name).join(' | ') || 'Sin asignar (Subasta)';
          const overdue = isTaskOverdue(t) ? 'SI (VENCIDA)' : 'NO';
          return [
            t.id,
            t.title,
            t.status,
            overdue,
            proj,
            assigned,
            t.startTime ? new Date(t.startTime).toLocaleString('es-ES') : '',
            t.endTime ? new Date(t.endTime).toLocaleString('es-ES') : '',
            t.startedAt ? new Date(t.startedAt).toLocaleString('es-ES') : '',
            t.completedAt ? new Date(t.completedAt).toLocaleString('es-ES') : '',
            Number(t.budget || 0).toFixed(2),
            t.currency || 'USD',
            t.paymentStatus === 'PAID' ? 'PAGADO' : (Number(t.budget) > 0 ? 'PENDIENTE' : 'N/A'),
            t.location || '',
            t.completionNote || ''
          ].map(escapeCsv).join(',');
        });

        const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `reporte_calendario_${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const handleExportICS = (task) => {
        if (!task) return;
        const formatIcsDate = (dateStr) => {
          const d = new Date(dateStr);
          const pad = (n) => String(n).padStart(2, '0');
          return `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;
        };

        const startUtc = formatIcsDate(task.startTime);
        const endUtc = formatIcsDate(task.endTime);
        const nowUtc = formatIcsDate(new Date().toISOString());
        const assignedNames = getTaskAssignedUsers(task, users).map(u => u.name).join(', ') || 'Subasta Abierta';
        const desc = `${task.description || 'Trabajo agendado'}\\nResponsables: ${assignedNames}${Number(task.budget) > 0 ? `\\nPresupuesto: $${Number(task.budget).toFixed(2)} ${task.currency || 'USD'}` : ''}`;

        const icsLines = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//Calendario Empresarial//ES',
          'BEGIN:VEVENT',
          `UID:${task.id}@calendario.empresarial`,
          `DTSTAMP:${nowUtc}`,
          `DTSTART:${startUtc}`,
          `DTEND:${endUtc}`,
          `SUMMARY:${task.title}`,
          `DESCRIPTION:${desc}`,
          `LOCATION:${task.location || ''}`,
          'END:VEVENT',
          'END:VCALENDAR'
        ];

        const blob = new Blob([icsLines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${task.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.ics`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const completedTasks = tasks.filter(t => t.status === 'COMPLETED');
      const overdueTasks = tasks.filter(t => isTaskOverdue(t));
      const pendingUsersCount = users.filter(u => u.status === 'PENDING_APPROVAL' || u.role === 'PENDING' || u.pendingRoleChange).length;

      if (!isLoggedIn) {
        return <LoginScreen users={users} onLogin={handleLogin} onRegister={handleRegisterUser} />;
      }

      return (
        <div className="min-h-screen flex flex-col bg-gray-950" onMouseUp={handleMouseUpCell}>
          {/* HEADER PRINCIPAL UNIFICADO Y OPTIMIZADO */}
          <header className="bg-gray-900/90 border-b border-gray-800 sticky top-0 z-30 backdrop-blur-md px-4 lg:px-8 h-14 flex items-center justify-between shadow-xl">
            {/* Left: Minimal Brand Badge & Quick Access Modals */}
            <div className="flex items-center space-x-3 text-xs">
              <div className="flex items-center space-x-2 font-extrabold text-white text-sm tracking-tight pr-2 border-r border-gray-800">
                <span className="text-base">📅</span>
                <span>Calendario</span>
              </div>

              <div className="hidden sm:flex items-center space-x-2">
                <button
                  onClick={() => setIsMetricsModalOpen(true)}
                  className="px-2.5 py-1.5 bg-gray-950 hover:bg-gray-900 border border-indigo-700/70 text-indigo-300 hover:text-white rounded-xl font-bold transition-all flex items-center space-x-1 cursor-pointer shadow-sm"
                >
                  <span>📊 Métricas & Reportes</span>
                </button>

                <button
                  onClick={() => setIsCompletedLogsModalOpen(true)}
                  className="px-2.5 py-1.5 bg-gray-950 hover:bg-gray-900 border border-gray-800 text-gray-300 hover:text-white rounded-xl font-semibold transition-all flex items-center space-x-1 cursor-pointer"
                >
                  <span>📋 Bitácora</span>
                  <span className="bg-indigo-900 text-indigo-200 rounded-full px-1.5 text-[10px] font-bold">{completedTasks.length}</span>
                </button>

                <button
                  onClick={() => setIsProjectsModalOpen(true)}
                  className="px-2.5 py-1.5 bg-gray-950 hover:bg-gray-900 border border-gray-800 text-gray-300 hover:text-white rounded-xl font-semibold transition-all flex items-center space-x-1 cursor-pointer"
                >
                  <span>📂 Proyectos</span>
                  <span className="bg-purple-900 text-purple-200 rounded-full px-1.5 text-[10px] font-bold">{projects.length}</span>
                </button>

                <button
                  onClick={() => setIsWhatsAppModalOpen(true)}
                  className="px-2.5 py-1.5 bg-gray-950 hover:bg-gray-900 border border-gray-800 text-gray-300 hover:text-white rounded-xl font-semibold transition-all flex items-center space-x-1 cursor-pointer"
                >
                  <span>💬 WhatsApp</span>
                  <span className="bg-emerald-900 text-emerald-200 rounded-full px-1.5 text-[10px] font-bold">{whatsAppLogs.length}</span>
                </button>

                {currentUser.role === 'BOSS' && (
                  <button
                    onClick={() => setIsUserMgmtModalOpen(true)}
                    className="px-2.5 py-1.5 bg-gray-950 hover:bg-gray-900 border border-gray-800 text-gray-300 hover:text-white rounded-xl font-semibold transition-all flex items-center space-x-1.5 cursor-pointer"
                  >
                    <span>👥 Usuarios</span>
                    {pendingUsersCount > 0 ? (
                      <span className="bg-amber-500 text-gray-950 font-black px-1.5 py-0.5 rounded-full text-[10px] animate-pulse">
                        {pendingUsersCount}
                      </span>
                    ) : (
                      <span className="bg-gray-800 text-gray-400 rounded-full px-1.5 text-[10px] font-bold">{users.length}</span>
                    )}
                  </button>
                )}
              </div>
            </div>

            {/* Right: Primary Action & User Profile Switcher */}
            <div className="flex items-center space-x-3">
              <button
                onClick={() => {
                  const dateStr = currentDate.toISOString().split('T')[0];
                  setNewTaskDefaults({ dateStr, startTimeStr: '09:00', endTimeStr: '11:00' });
                  setIsParticipantsOpen(false);
                  setIsNewTaskModalOpen(true);
                }}
                className="flex items-center space-x-1.5 px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/30 text-xs transition-all cursor-pointer"
              >
                <span>+ {currentUser.role === 'BOSS' ? 'Lanzar Subasta / Asignar' : 'Agendar Tarea'}</span>
              </button>

              {/* User Selector Dropdown Pill */}
              <div className="relative">
                <button
                  onClick={() => setIsUserDropdownOpen(prev => !prev)}
                  className={`flex items-center space-x-2 px-3 py-2 rounded-xl border text-xs font-bold transition-all shadow-sm cursor-pointer ${
                    currentUser.role === 'BOSS'
                      ? 'bg-amber-950/80 border-amber-700 text-amber-300'
                      : currentUser.role === 'THIRD_PARTY'
                      ? 'bg-teal-950/80 border-teal-700 text-teal-300'
                      : 'bg-emerald-950/80 border-emerald-700 text-emerald-300'
                  }`}
                >
                  <span>{currentUser.role === 'BOSS' ? '👑' : currentUser.role === 'THIRD_PARTY' ? '🔧' : '👷'}</span>
                  <span className="truncate max-w-[130px] hidden lg:inline-block">
                    {currentUser.name.split(' ')[0]} ({currentUser.role === 'BOSS' ? 'Jefe' : currentUser.role === 'THIRD_PARTY' ? '3ero' : 'Empleado'})
                  </span>
                  <span className="text-[10px] text-gray-400">{isUserDropdownOpen ? '▲' : '▼'}</span>
                </button>

                {isUserDropdownOpen && (
                  <div className="absolute right-0 mt-2 w-64 bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl py-2 z-50 divide-y divide-gray-800/60 backdrop-blur-md">
                    {/* Logged in User Header */}
                    <div className="px-4 py-3 bg-gray-950/40">
                      <div className="flex items-center space-x-2.5">
                        <div className={`w-9 h-9 rounded-xl flex items-center justify-center text-base font-bold shadow-md ${
                          currentUser.role === 'BOSS'
                            ? 'bg-amber-950 border border-amber-700/60 text-amber-300'
                            : currentUser.role === 'THIRD_PARTY'
                            ? 'bg-teal-950 border border-teal-700/60 text-teal-300'
                            : 'bg-emerald-950 border border-emerald-700/60 text-emerald-300'
                        }`}>
                          {currentUser.role === 'BOSS' ? '👑' : currentUser.role === 'THIRD_PARTY' ? '🔧' : '👷'}
                        </div>
                        <div className="truncate">
                          <p className="font-extrabold text-white text-xs truncate">{currentUser.name}</p>
                          <p className="text-[10px] text-gray-400 truncate">{currentUser.email}</p>
                          <span className="inline-block mt-0.5 px-2 py-0.5 bg-gray-800 text-gray-300 text-[9px] font-bold rounded-md uppercase">
                            {currentUser.role === 'BOSS' ? 'Jefe / Admin' : currentUser.role === 'THIRD_PARTY' ? 'Contratista 3ero' : 'Empleado Técnico'}
                          </span>
                        </div>
                      </div>
                    </div>

                    {/* User Session Actions */}
                    <div className="pt-2 px-1.5 space-y-1">
                      <button
                        onClick={() => { setIsUserDropdownOpen(false); setIsProfileModalOpen(true); }}
                        className="w-full px-3 py-2 text-left text-xs font-bold text-emerald-400 hover:bg-emerald-950/60 hover:text-emerald-300 rounded-xl transition-colors flex items-center space-x-2 cursor-pointer"
                      >
                        <span>✏️</span>
                        <span>Editar Mi Perfil</span>
                      </button>

                      <button
                        onClick={() => { setIsUserDropdownOpen(false); handleLogout(); }}
                        className="w-full px-3 py-2 text-left text-xs font-bold text-red-400 hover:bg-red-950/60 hover:text-red-300 rounded-xl transition-colors flex items-center space-x-2 cursor-pointer"
                      >
                        <span>🚪</span>
                        <span>Cerrar Sesión</span>
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-6">
            {currentUser.role === 'BOSS' && pendingUsersCount > 0 && (
              <div className="mb-4 bg-gradient-to-r from-amber-950 via-amber-900 to-amber-950 border border-amber-500/80 p-3.5 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-3 shadow-xl animate-pulse">
                <div className="flex items-center space-x-2.5 text-xs text-amber-200">
                  <span className="text-xl">🔔</span>
                  <div>
                    <strong className="text-white text-sm">¡Tienes {pendingUsersCount} solicitud(es) de aprobación pendiente(s)!</strong>
                    <p className="text-amber-300/90 text-[11px]">Hay nuevas cuentas registradas o cambios de rol esperando tu autorización.</p>
                  </div>
                </div>
                <button
                  onClick={() => setIsUserMgmtModalOpen(true)}
                  className="px-4 py-2 bg-amber-400 hover:bg-amber-300 text-gray-950 font-black text-xs rounded-xl shadow-lg shadow-amber-500/30 transition-all shrink-0 cursor-pointer"
                >
                  ⚡ Revisar y Aprobar Ahora
                </button>
              </div>
            )}

            {/* BANNER DE CONTRAOFERTAS / OFERTAS DE CONTRATISTAS PENDIENTES PARA EL JEFE */}
            {(() => {
              if (currentUser.role !== 'BOSS') return null;
              const tasksWithBids = tasks.filter(t => t.status === 'OPEN_AUCTION' && Array.isArray(t.bids) && t.bids.length > 0);
              if (tasksWithBids.length === 0) return null;
              const totalBids = tasksWithBids.reduce((acc, t) => acc + t.bids.length, 0);

              return (
                <div className="mb-4 bg-gradient-to-r from-indigo-950 via-purple-950 to-indigo-950 border-2 border-indigo-500 p-4 rounded-2xl space-y-3 shadow-xl">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                    <div className="flex items-center space-x-3 text-sm text-indigo-100">
                      <span className="text-2xl">💰</span>
                      <div>
                        <strong className="text-white text-base">
                          ¡Tienes {totalBids} oferta(s) / contraoferta(s) de contratistas por revisar!
                        </strong>
                        <p className="text-indigo-200 text-xs">
                          Haz clic en cualquiera de las subastas de abajo o apruébala directamente aquí:
                        </p>
                      </div>
                    </div>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {tasksWithBids.map(t => (
                      <div key={t.id} className="bg-gray-950/90 border border-indigo-600/70 rounded-xl p-3.5 space-y-2.5">
                        <div className="flex items-center justify-between gap-2">
                          <button
                            type="button"
                            onClick={() => setSelectedTask(t)}
                            className="text-sm font-extrabold text-amber-300 hover:underline text-left truncate cursor-pointer"
                          >
                            {t.title}
                          </button>
                          <span className="text-xs font-mono font-bold text-gray-300 shrink-0">
                            Base: ${Number(t.budget || 0).toFixed(2)} {t.currency || 'USD'}
                          </span>
                        </div>
                        <div className="space-y-2">
                          {t.bids.map(b => (
                            <div key={b.id} className="flex items-center justify-between gap-2 bg-gray-900 border border-gray-700 px-3 py-2 rounded-xl text-sm">
                              <div className="min-w-0">
                                <span className="font-extrabold text-white">🔧 {b.userName}</span>
                                <span className="ml-2 font-mono font-black text-emerald-400 text-base">
                                  ${Number(b.amount).toFixed(2)} {t.currency || 'USD'}
                                </span>
                                {b.note && <p className="text-xs text-gray-300 mt-0.5">“{b.note}”</p>}
                              </div>
                              <div className="flex items-center gap-2 shrink-0">
                                <button
                                  type="button"
                                  onClick={() => handleAcceptCounterBid(t.id, b)}
                                  className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow cursor-pointer"
                                >
                                  ✅ Aprobar
                                </button>
                                <button
                                  type="button"
                                  onClick={() => setSelectedTask(t)}
                                  className="px-2.5 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-100 font-semibold text-xs rounded-xl cursor-pointer"
                                >
                                  Ver
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })()}

            {/* BANNER DE ALERTA DE TAREAS VENCIDAS (MÓDULO 5) */}
            {overdueTasks.length > 0 && (
              <div className="mb-4 bg-gradient-to-r from-red-950 via-red-900/90 to-red-950 border border-red-500/80 p-3.5 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-3 shadow-xl">
                <div className="flex items-center space-x-2.5 text-xs text-red-200">
                  <span className="text-xl">⚠️</span>
                  <div>
                    <strong className="text-white text-sm">
                      ¡Atención! Hay {overdueTasks.length} tarea(s) con horario vencido sin completar:
                    </strong>
                    <div className="flex flex-wrap gap-1.5 mt-1">
                      {overdueTasks.slice(0, 4).map(ot => (
                        <button
                          key={ot.id}
                          type="button"
                          onClick={() => setSelectedTask(ot)}
                          className="px-2 py-0.5 bg-red-950 hover:bg-red-800 border border-red-500/70 rounded-lg text-[11px] font-bold text-red-200 cursor-pointer"
                        >
                          🚨 {ot.title}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
                <button
                  type="button"
                  onClick={() => setSelectedTask(overdueTasks[0])}
                  className="px-3.5 py-2 bg-red-600 hover:bg-red-500 text-white font-bold text-xs rounded-xl shadow shrink-0 cursor-pointer"
                >
                  Revisar Vencidas
                </button>
              </div>
            )}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
              {/* LEFT SIDEBAR (COLLAPSIBLE) */}
              {isSidebarOpen && (
                <div className="lg:col-span-3 space-y-4">
                  {/* Mini Calendar */}
                  <div className="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-xl space-y-3">
                    <div className="flex items-center justify-between text-xs font-bold text-gray-200 pb-2 border-b border-gray-800">
                      <span className="capitalize">
                        {currentDate.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })}
                      </span>
                      <div className="flex items-center space-x-1">
                        <button
                          onClick={() => {
                            const d = new Date(currentDate);
                            d.setMonth(d.getMonth() - 1);
                            setCurrentDate(d);
                          }}
                          className="p-1 text-gray-400 hover:text-white rounded-lg hover:bg-gray-800"
                        >◄</button>
                        <button
                          onClick={() => {
                            const d = new Date(currentDate);
                            d.setMonth(d.getMonth() + 1);
                            setCurrentDate(d);
                          }}
                          className="p-1 text-gray-400 hover:text-white rounded-lg hover:bg-gray-800"
                        >►</button>
                      </div>
                    </div>

                    <div className="grid grid-cols-7 text-[10px] font-bold text-gray-500 text-center">
                      <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
                    </div>

                    <div className="grid grid-cols-7 gap-1 text-xs text-center">
                      {monthDays.map((day, idx) => {
                        const dayStr = day.toDateString();
                        const isSelected = dayStr === currentDate.toDateString();
                        const isToday = dayStr === new Date().toDateString();
                        const isCurrentMonth = day.getMonth() === currentDate.getMonth();

                        const dayTasks = filteredTasks.filter(t => new Date(t.startTime).toDateString() === dayStr);

                        return (
                          <button
                            key={idx}
                            onClick={() => {
                              setCurrentDate(day);
                              if (viewMode === 'MONTH') setViewMode('WEEK');
                            }}
                            title={
                              dayTasks.length > 0
                                ? `${day.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })}: ${dayTasks.length} tarea(s)\n${dayTasks.map(t => '• ' + t.title).join('\n')}`
                                : `${day.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })}`
                            }
                            className={`py-1 px-0.5 rounded-lg text-[11px] font-medium flex flex-col items-center justify-center min-h-[36px] transition-all relative ${
                              isSelected
                                ? 'bg-indigo-600 text-white font-bold shadow-lg shadow-indigo-600/30'
                                : isToday
                                ? 'bg-indigo-950 text-indigo-400 border border-indigo-700/60 font-bold'
                                : isCurrentMonth
                                ? 'text-gray-300 hover:bg-gray-800'
                                : 'text-gray-600 hover:bg-gray-800/50'
                            }`}
                          >
                            <span>{day.getDate()}</span>

                            {dayTasks.length > 0 && (
                              <div className="flex items-center justify-center space-x-0.5 mt-0.5 max-w-full px-0.5">
                                {dayTasks.slice(0, 4).map((t, tIdx) => {
                                  const assignedUsers = getTaskAssignedUsers(t, users);
                                  const isOpenAuction = t.status === 'OPEN_AUCTION' || getTaskAssignedIds(t).length === 0;
                                  const isCompleted = t.status === 'COMPLETED';
                                  const hasContractor = assignedUsers.some(u => u.role === 'THIRD_PARTY');

                                  let dotColorClass = 'bg-indigo-500';
                                  if (isCompleted) {
                                    dotColorClass = 'bg-emerald-500';
                                  } else if (isOpenAuction) {
                                    dotColorClass = 'bg-amber-400 animate-pulse shadow-sm shadow-amber-400/50';
                                  } else if (t.isPersonal) {
                                    dotColorClass = 'bg-purple-500';
                                  } else if (hasContractor) {
                                    dotColorClass = 'bg-amber-600';
                                  }

                                  return (
                                    <span
                                      key={t.id || tIdx}
                                      className={`w-1.5 h-1.5 rounded-full ${dotColorClass} shrink-0`}
                                    />

                              type="button"
                              onClick={() => { setSelectedUserFilter(''); setIsFilterDropdownOpen(false); }}
                              className={`w-full px-3.5 py-2 text-left text-xs font-semibold flex items-center justify-between transition-colors ${
                                selectedUserFilter === '' ? 'bg-emerald-600/30 text-emerald-300 font-bold' : 'text-gray-300 hover:bg-gray-800 hover:text-white'
                              }`}
                            >
                              <span>👥 Todos los Usuarios</span>
                              {selectedUserFilter === '' && <span className="text-emerald-400 font-bold">✓</span>}
                            </button>
                            <div className="py-1">
                              {users.map(u => (
                                <button
                                  key={u.id}
                                  type="button"
                                  onClick={() => { setSelectedUserFilter(u.id); setIsFilterDropdownOpen(false); }}
                                  className={`w-full px-3.5 py-2 text-left text-xs font-semibold flex items-center justify-between transition-colors ${
                                    selectedUserFilter === u.id ? 'bg-emerald-600/30 text-emerald-300 font-bold' : 'text-gray-300 hover:bg-gray-800 hover:text-white'

                                  <div className="flex items-center space-x-2 truncate">

                                </button>

                            </div>
                          </div>

                    <div className="flex items-center space-x-1.5 bg-gray-950 border border-gray-800 rounded-xl px-2.5 py-1.5 text-xs text-gray-300">

                          return (
                            <div key={dayIdx} className="border-r border-gray-800/40 relative hover:bg-indigo-950/10 transition-colors">

                              )}

                                const isBeingDragged = dragState?.isDragging && dragState.day?.toDateString() === dayStr && hour >= Math.min(dragState.startHour, dragState.currentHour ?? dragState.startHour) && hour <= Math.max(dragState.startHour, dragState.currentHour ?? dragState.startHour);

                                return (
                                  <div
                                    key={hour}
                                    onMouseDown={() => handleMouseDownCell(day, hour)}
                                    onMouseEnter={() => handleMouseEnterCell(hour)}

                                    onDrop={(e) => {
                                      e.preventDefault();
                                      handleDropTaskOnSlot(day, hour);

                                    <span className="opacity-0 group-hover:opacity-100 text-[10px] font-semibold text-indigo-400 bg-indigo-950 px-1.5 py-0.5 rounded border border-indigo-800">
                                      + Agendar {hour}:00
                                    </span>
                                  </div>
                                );
                              })}

                                const start = new Date(t.startTime);
                                const end = new Date(t.endTime);
                                const startFloat = start.getHours() + start.getMinutes() / 60;
                                const endFloat = end.getHours() + end.getMinutes() / 60;
                                const clampedStart = Math.max(8, Math.min(20, startFloat));
                                const clampedEnd = Math.max(8, Math.min(20, endFloat));

                                const topPx = (clampedStart - 8) * ROW_HEIGHT;
                                const heightPx = Math.max(45, (clampedEnd - clampedStart) * ROW_HEIGHT);
                                const layout = getTaskColumnLayout(t, dayTasks);
                                const assignedUsers = getTaskAssignedUsers(t, users);
                                const isOpenAuction = t.status === 'OPEN_AUCTION' || assignedUsers.length === 0;
                                const hasContractor = assignedUsers.some(u => u.role === 'THIRD_PARTY');
                                const taskProject = projects.find(p => p.id === t.projectId);

                                return (
                                  <div
                                    key={t.id}
                                    draggable={t.status !== 'COMPLETED'}
                                    onDragStart={(e) => {
                                      e.stopPropagation();
                                      setDraggedTaskId(t.id);
                                    }}
                                    onDragEnd={() => setDraggedTaskId(null)}
                                    onClick={(e) => { e.stopPropagation(); setSelectedTask(t); }}
                                    style={{ top: `${topPx}px`, height: `${heightPx}px`, left: layout.left, width: layout.width }}
                                    title="Clic para ver detalles o arrastra para cambiar de día/hora"
                                    className={`absolute p-2.5 rounded-xl border text-xs cursor-grab active:cursor-grabbing shadow-lg transition-all hover:scale-[1.02] hover:z-20 flex flex-col justify-between overflow-hidden ${
                                      t.status === 'COMPLETED'
                                        ? 'bg-gradient-to-br from-emerald-950 via-emerald-900/95 to-emerald-950 border-emerald-400 text-emerald-100 shadow-emerald-900/50'
                                        : isOpenAuction
                                        ? 'bg-gradient-to-br from-amber-950 via-amber-900 to-amber-950 border-amber-400 text-amber-100 shadow-amber-900/50 animate-pulse'
                                        : t.isPersonal
                                        ? 'bg-purple-950/90 border-purple-600/80 text-purple-100'
                                        : hasContractor
                                        ? 'bg-amber-950/90 border-amber-600/80 text-amber-100'
                                        : 'bg-indigo-950/90 border-indigo-600/80 text-indigo-100'
                                    }`}

                                    <div>
                                      <div className="flex items-start justify-between font-bold text-[11px] leading-tight mb-0.5">
                                        <span className={`truncate ${t.status === 'COMPLETED' ? 'text-emerald-200' : ''}`}>
                                          {t.status === 'COMPLETED' ? `✅ ${t.title}` : (t.recurrenceLabel ? `🔄 ${t.title}` : t.title)}
                                        </span>
                                        {t.status === 'COMPLETED' ? (
                                          <span className="bg-emerald-500 text-gray-950 font-black text-[9px] px-1 rounded shadow shrink-0 ml-1">✓ LISTO</span>
                                        ) : isOpenAuction ? (
                                          <span className="bg-amber-400 text-gray-950 font-black text-[9px] px-1 rounded shadow">⚡ SUBASTA</span>
                                        ) : (
                                          <span className="text-red-400 shrink-0 ml-1">🔒</span>
                                        )}
                                      </div>
                                      <div className="flex flex-wrap items-center gap-1 mb-0.5">
                                        {taskProject && (
                                          <span className="inline-block bg-gray-950/90 text-purple-300 border border-purple-800/60 text-[9px] px-1 py-0.2 rounded truncate max-w-full">
                                            📂 {taskProject.name}

                                      <p className="text-[10px] font-bold truncate">
                                        {isOpenAuction && t.status !== 'COMPLETED'
                                          ? '⚡ ¡RECLAMAR AHORA!'

                                          ? `👥 ${assignedUsers.map(u => u.name.split(' ')[0]).join(', ')}`

                                        t.status === 'COMPLETED' ? 'bg-emerald-600 text-white' : 'bg-gray-900/80'

                                        {t.status === 'COMPLETED' ? 'COMPLETADO' : isOpenAuction ? 'LIBRE' : t.status}
                                      </span>
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                )}

                  <div className="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-xl">

                      <h3 className="font-bold text-white capitalize">{currentDate.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</h3>
                    </div>
                    <div className="max-h-[650px] overflow-y-auto divide-y divide-gray-800/60">
                      {hours.slice(0, -1).map(hour => {
                        const dayStr = currentDate.toDateString();
                        const hourTasks = filteredTasks.filter(t => {
                          const start = new Date(t.startTime);
                          return start.toDateString() === dayStr && start.getHours() === hour;
                        });

                        return (
                          <div
                            key={hour}
                            onClick={() => handleCellClick(currentDate, hour)}
                            onDragOver={(e) => e.preventDefault()}
                            onDrop={(e) => {
                              e.preventDefault();
                              handleDropTaskOnSlot(currentDate, hour);

                              {hourTasks.map(t => {
                                const assignedUsers = getTaskAssignedUsers(t, users);
                                const isOpenAuction = t.status === 'OPEN_AUCTION' || assignedUsers.length === 0;
                                const isCompleted = t.status === 'COMPLETED';

                                      setDraggedTaskId(t.id);

                                    onClick={(e) => { e.stopPropagation(); setSelectedTask(t); }}
                                    className={`p-3 border rounded-xl flex justify-between items-center shadow cursor-grab active:cursor-grabbing transition-all ${

                                        : t.isPersonal
                                        ? 'bg-purple-950 border-purple-600 text-purple-100'

                                        ? 'bg-amber-950/90 border-amber-600 text-amber-100'
                                        : 'bg-indigo-950 border-indigo-700 text-white'

                                    <div>
                                      <div className="flex items-center gap-2">
                                        <h4 className="font-bold text-sm">
                                          {isCompleted ? `✅ ${t.title}` : (t.recurrenceLabel ? `🔄 ${t.title}` : t.title)}

                                        {Number(t.budget) > 0 && (
                                          <span className="text-[11px] font-mono font-bold px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-300 border border-emerald-600">
                                            💰 ${Number(t.budget).toFixed(2)} {t.currency || 'USD'}
